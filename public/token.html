<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANTARES — Full Analysis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --c-safe: #00e5b0; --c-caution: #f5d000; --c-danger: #ff5f5f; --c-rug: #ff2244;
      --bg: #0e0e10; --bg-card: #141417; --border: #1f1f22;
      --text: #d8d8d8; --text-dim: #3a3a3f; --text-mid: #888;
    }
    body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Mono', monospace; min-height: 100vh; }
    #app { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }

    /* header */
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
    .brand { font-size: 10px; letter-spacing: 0.35em; color: var(--text-dim); text-transform: uppercase; }
    .back { font-size: 10px; color: var(--text-dim); text-decoration: none; letter-spacing: 0.1em; transition: color .15s; }
    .back:hover { color: var(--text); }

    /* loading */
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }
    .loading { display: flex; align-items: center; gap: 10px; color: var(--text-dim); font-size: 13px; padding: 60px 0; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #3a3a3f; animation: pulse 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }

    /* hero */
    .hero { margin-bottom: 28px; }
    .token-name { font-size: 13px; color: var(--text-mid); margin-bottom: 6px; letter-spacing: 0.05em; }
    .risk-label { font-family: 'Bebas Neue', sans-serif; font-size: 64px; line-height: 1; letter-spacing: 0.03em; margin-bottom: 8px; }
    .risk-label.safe    { color: var(--c-safe); }
    .risk-label.caution { color: var(--c-caution); }
    .risk-label.danger  { color: var(--c-danger); }
    .risk-label.rug     { color: var(--c-rug); }
    .score-line { font-size: 12px; color: var(--text-dim); }
    .score-line strong { color: var(--text-mid); }

    /* bar */
    .bar { height: 3px; background: #1c1c1f; margin: 14px 0 28px; overflow: hidden; border-radius: 2px; }
    .bar-f { height: 100%; width: 0; transition: width 1.2s cubic-bezier(.22,1,.36,1); }
    .safe    .bar-f { background: var(--c-safe); }
    .caution .bar-f { background: var(--c-caution); }
    .danger  .bar-f { background: var(--c-danger); }
    .rug     .bar-f { background: var(--c-rug); }

    /* grid metrics */
    .metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin-bottom: 28px; }
    .metric { background: var(--bg-card); border: 1px solid var(--border); padding: 12px 14px; border-radius: 2px; }
    .metric-label { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px; }
    .metric-value { font-size: 16px; font-weight: 700; color: var(--text); }

    /* section */
    .section { margin-bottom: 28px; }
    .section-title { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }

    /* flags */
    .flag { display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px; background: var(--bg-card); border-left: 2px solid; margin-bottom: 4px; }
    .flag.critical { border-color: var(--c-rug); }
    .flag.warning  { border-color: var(--c-caution); }
    .flag.info     { border-color: #3a4a60; }
    .flag.bonus    { border-color: var(--c-safe); }
    .flag-label { font-size: 12px; color: var(--text-mid); flex: 1; }
    .flag-sev { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
    .flag.critical .flag-sev { color: var(--c-rug); }
    .flag.warning  .flag-sev { color: var(--c-caution); }
    .flag.info     .flag-sev { color: #6080a0; }
    .flag.bonus    .flag-sev { color: var(--c-safe); }
    .flag-impact { font-size: 10px; color: var(--text-dim); white-space: nowrap; margin-left: 8px; }

    /* sources */
    .source-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); padding: 7px 0; border-bottom: 1px solid #171719; }
    .source-row span:last-child { color: #666; }

    /* price changes */
    .pos { color: var(--c-safe); }
    .neg { color: var(--c-rug); }

    /* actions */
    .actions { display: flex; gap: 12px; margin-top: 32px; }
    .btn { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; padding: 10px 18px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-mid); cursor: pointer; text-decoration: none; transition: color .15s, border-color .15s; }
    .btn:hover { color: var(--text); border-color: #444; }

    /* error */
    .error { color: var(--c-danger); font-size: 14px; padding: 40px 0; }

    /* mint */
    .mint-box { font-size: 10px; color: var(--text-dim); word-break: break-all; padding: 10px 12px; background: var(--bg-card); border: 1px solid var(--border); margin-bottom: 28px; }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <span class="brand">ANTARES</span>
    <a class="back" href="javascript:history.back()">&larr; Back</a>
  </div>
  <div id="content"><div class="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span>Scanning token&hellip;</span></div></div>
</div>
<script>
  const API = 'https://antares-extension.vercel.app/api/scan';
  const RISK_CLASS = { SAFE: 'safe', CAUTION: 'caution', DANGER: 'danger', RUG: 'rug' };
  const LABELS = { SAFE: 'SAFE', CAUTION: 'CAUTION', DANGER: 'DANGER', RUG: 'RUG PULL' };

  function fmt(n) {
    if (n >= 1e9) return '$' + (n/1e9).toFixed(2) + 'B';
    if (n >= 1e6) return '$' + (n/1e6).toFixed(2) + 'M';
    if (n >= 1e3) return '$' + (n/1e3).toFixed(1) + 'K';
    return '$' + Number(n).toFixed(2);
  }
  function pct(v) {
    if (v === null || v === undefined) return '<span style="color:#3a3a3f">-</span>';
    const n = Number(v);
    const cls = n >= 0 ? 'pos' : 'neg';
    return '<span class="' + cls + '">' + (n >= 0 ? '+' : '') + n.toFixed(2) + '%</span>';
  }
  function ago(ts) {
    if (!ts) return '-';
    const m = Math.floor((Date.now() - ts) / 60000);
    if (m < 60) return m + 'm ago';
    if (m < 1440) return Math.floor(m/60) + 'h ago';
    return Math.floor(m/1440) + 'd ago';
  }

  async function load() {
    const ca = new URLSearchParams(window.location.search).get('ca');
    const el = document.getElementById('content');
    if (!ca) { el.innerHTML = '<div class="error">No token address provided.</div>'; return; }
    document.title = 'ANTARES — ' + ca.slice(0, 8) + '…';
    try {
      const res = await fetch(API + '?ca=' + ca);
      if (!res.ok) throw new Error(res.status);
      const d = await res.json();
      const rc   = RISK_CLASS[d.risk] || 'danger';
      const lbl  = LABELS[d.risk]    || d.risk;
      const mc   = d.marketCap || d.pair?.marketCap || d.pair?.fdv;
      const liq  = d.liquidity  || d.pair?.liquidity?.usd;
      const holders = d.holders !== null && d.holders !== undefined ? Number(d.holders).toLocaleString() : null;
      const priceUsd = d.priceUsd ? '$' + Number(d.priceUsd).toFixed(8).replace(/0+$/, '').replace(/\\.$/, '') : null;
      const barW = Math.round((d.score || 0) / 10);
      const mint = d.resolvedMint || ca;
      const sym  = d.tokenSymbol ? d.tokenSymbol + ' — ' : '';
      const name = d.tokenName   || '';

      const metrics = [
        mc       ? { l: 'Market Cap',  v: fmt(mc) }   : null,
        liq      ? { l: 'Liquidity',   v: fmt(liq) }  : null,
        priceUsd ? { l: 'Price',       v: priceUsd }  : null,
        holders  ? { l: 'Holders',     v: holders }   : null,
        d.volume24h ? { l: 'Vol 24h',  v: fmt(d.volume24h) } : null,
        d.volume1h  ? { l: 'Vol 1h',   v: fmt(d.volume1h) }  : null,
        { l: 'Confidence', v: (d.confidence || 0) + '%' },
      ].filter(Boolean).map(m => '<div class="metric"><div class="metric-label">' + m.l + '</div><div class="metric-value">' + m.v + '</div></div>').join('');

      const priceChanges = (d.priceChange5m !== null || d.priceChange1h !== null || d.priceChange24h !== null) ? `
        <div class="section">
          <div class="section-title">Price Changes</div>
          <div class="metrics">
            ${ d.priceChange5m  !== null ? '<div class="metric"><div class="metric-label">5 min</div><div class="metric-value">' + pct(d.priceChange5m)  + '</div></div>' : '' }
            ${ d.priceChange1h  !== null ? '<div class="metric"><div class="metric-label">1 hour</div><div class="metric-value">' + pct(d.priceChange1h)  + '</div></div>' : '' }
            ${ d.priceChange24h !== null ? '<div class="metric"><div class="metric-label">24 hours</div><div class="metric-value">' + pct(d.priceChange24h) + '</div></div>' : '' }
          </div>
        </div>` : '';

      const flagsHtml = (d.flags || []).map(f => `
        <div class="flag ${f.severity}">
          <span class="flag-sev">${f.severity}</span>
          <span class="flag-label">${f.label}</span>
          ${f.impact > 0 ? '<span class="flag-impact">−' + f.impact + '</span>' : f.impact < 0 ? '<span class="flag-impact" style="color:var(--c-safe)">+' + Math.abs(f.impact) + '</span>' : ''}
        </div>`).join('');

      const sourceRows = (d.sources_used || []).map(s => `
        <div class="source-row"><span>${s}</span><span>&#10003; Used</span></div>`).join('');

      const dexHref = d.pair?.url || ('https://dexscreener.com/solana/' + mint);
      const createdAt = d.pairCreatedAt ? ago(d.pairCreatedAt) : null;

      el.innerHTML = `
        <div class="hero ${rc}">
          <div class="token-name">${sym}${name || mint.slice(0,12) + '...'} ${createdAt ? '<span style="color:#3a3a3f">— ' + createdAt + '</span>' : ''}</div>
          <div class="risk-label ${rc}">${lbl}</div>
          <div class="score-line">Score <strong>${d.score}</strong> / 1000</div>
          <div class="bar"><div class="bar-f" id="bar-fill"></div></div>
        </div>
        <div class="mint-box">${mint}</div>
        <div class="metrics">${metrics}</div>
        ${priceChanges}
        ${ flagsHtml ? '<div class="section"><div class="section-title">Risk Flags (' + (d.flags||[]).length + ')</div>' + flagsHtml + '</div>' : '' }
        ${ sourceRows ? '<div class="section"><div class="section-title">Data Sources</div>' + sourceRows + '</div>' : '' }
        <div class="actions">
          <a class="btn" href="${dexHref}" target="_blank" rel="noopener noreferrer">&#8599; DexScreener</a>
          <a class="btn" href="https://solscan.io/token/${mint}" target="_blank" rel="noopener noreferrer">&#8599; Solscan</a>
        </div>
      `;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const bf = document.getElementById('bar-fill');
        if (bf) bf.style.width = barW + '%';
      }));
      document.title = 'ANTARES — ' + (d.tokenSymbol || mint.slice(0,8)) + ' — ' + lbl;
    } catch(e) {
      document.getElementById('content').innerHTML = '<div class="error">Analysis error. Please try again.</div>';
    }
  }
  load();
<\/script>
</body>
</html>
