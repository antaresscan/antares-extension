<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Antares — Token Analysis</title>
  <meta name="description" content="Antares scans Solana tokens in real time — detects rug pulls, honeypots, bundlers and chart manipulation directly in your browser.">
<meta property="og:title" content="Antares — Token Analysis">
<meta property="og:description" content="Real-time Solana token security scanner. Detects rug pulls, honeypots, bundlers and chart manipulation.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://antares-extension.vercel.app/token.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Antares — Token Analysis">
<meta name="twitter:description" content="Real-time Solana token security scanner. Detects rug pulls, honeypots, bundlers and chart manipulation.">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{cursor:crosshair;scroll-behavior:smooth}
body{background:#0f0f11;color:#c8c8d0;font-family:'IBM Plex Mono',monospace;overflow-x:hidden;min-height:100vh}
canvas#bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:32px 20px 80px}

/* ── keyframes ── */
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes ant-flicker-safe    {0%,100%{text-shadow:0 0 30px rgba(0,229,176,.4),0 0 80px rgba(0,229,176,.15)} 50%{text-shadow:0 0 60px rgba(0,229,176,.75),0 0 130px rgba(0,229,176,.35)}}
@keyframes ant-flicker-caution {0%,100%{text-shadow:0 0 30px rgba(245,208,0,.4),0 0 80px rgba(245,208,0,.15)} 50%{text-shadow:0 0 60px rgba(245,208,0,.75),0 0 130px rgba(245,208,0,.35)}}
@keyframes ant-flicker-danger  {0%,100%{text-shadow:0 0 30px rgba(255,95,95,.4),0 0 80px rgba(255,95,95,.15)} 50%{text-shadow:0 0 60px rgba(255,95,95,.75),0 0 130px rgba(255,95,95,.35)}}
@keyframes ant-flicker-rug     {0%,100%{text-shadow:0 0 30px rgba(255,34,68,.5),0 0 80px rgba(255,34,68,.2)} 50%{text-shadow:0 0 70px rgba(255,34,68,.95),0 0 150px rgba(255,34,68,.45)}}
@keyframes ant-glitch {
  0%,89%,100%{transform:translateX(0);opacity:0}
  91%{transform:translateX(-3px);opacity:.5}
  93%{transform:translateX(3px);opacity:.4}
  95%{transform:translateX(-1px);opacity:.3}
  97%{transform:translateX(0);opacity:0}
}
@keyframes sbar-in{from{width:0%}to{width:var(--bar-w,0%)}}
@keyframes topbar-glow{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

/* ── header ── */
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px}
.logo{font-size:13px;letter-spacing:.55em;color:#444;text-transform:uppercase}
.ca-badge{font-size:9px;color:#777;background:#111113;border:1px solid #222;border-radius:2px;padding:5px 10px;letter-spacing:.06em;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── risk containers ── */
.risk-wrap{
  position:relative;
  border-radius:4px;
  padding:20px 22px 22px;
  margin-bottom:12px;
  overflow:hidden;
}
.risk-wrap::before,.risk-wrap::after{
  content:'';position:absolute;width:12px;height:12px;border-style:solid;z-index:10;pointer-events:none;
}
.risk-wrap::before{top:0;left:0;border-width:1.5px 0 0 1.5px}
.risk-wrap::after{bottom:0;right:0;border-width:0 1.5px 1.5px 0}

.safe    .risk-wrap,.risk-wrap.safe    {background:linear-gradient(180deg,#0b100f 0%,#090b0a 100%);border:1px solid rgba(0,229,176,.18);box-shadow:0 0 0 1px rgba(0,229,176,.06),0 24px 64px rgba(0,0,0,.85),0 0 50px rgba(0,229,176,.05)}
.caution .risk-wrap,.risk-wrap.caution {background:linear-gradient(180deg,#0e0d0a 0%,#0a0a09 100%);border:1px solid rgba(245,208,0,.18);box-shadow:0 0 0 1px rgba(245,208,0,.06),0 24px 64px rgba(0,0,0,.85),0 0 50px rgba(245,208,0,.05)}
.danger  .risk-wrap,.risk-wrap.danger  {background:linear-gradient(180deg,#0e0a0a 0%,#0a0909 100%);border:1px solid rgba(255,95,95,.18);box-shadow:0 0 0 1px rgba(255,95,95,.06),0 24px 64px rgba(0,0,0,.85),0 0 50px rgba(255,95,95,.05)}
.rug     .risk-wrap,.risk-wrap.rug     {background:linear-gradient(180deg,#110709 0%,#090707 100%);border:1px solid rgba(255,34,68,.22);box-shadow:0 0 0 1px rgba(255,34,68,.08),0 24px 64px rgba(0,0,0,.9), 0 0 60px rgba(255,34,68,.08)}

.safe    .risk-wrap::before,.safe    .risk-wrap::after,.risk-wrap.safe::before,   .risk-wrap.safe::after    {border-color:rgba(0,229,176,.4)}
.caution .risk-wrap::before,.caution .risk-wrap::after,.risk-wrap.caution::before,.risk-wrap.caution::after {border-color:rgba(245,208,0,.4)}
.danger  .risk-wrap::before,.danger  .risk-wrap::after,.risk-wrap.danger::before, .risk-wrap.danger::after  {border-color:rgba(255,95,95,.4)}
.rug     .risk-wrap::before,.rug     .risk-wrap::after,.risk-wrap.rug::before,    .risk-wrap.rug::after     {border-color:rgba(255,34,68,.45)}

/* topbar */
.topbar{height:2px;margin:-20px -22px 18px;position:relative;overflow:visible}
.topbar::before{content:'';display:block;height:100%}
.topbar::after{content:'';position:absolute;top:-1px;left:0;right:0;height:4px;filter:blur(4px);animation:topbar-glow 2.5s ease-in-out infinite}
.safe    .topbar::before,.risk-wrap.safe    .topbar::before{background:linear-gradient(90deg,transparent,#00e5b0,transparent)}
.caution .topbar::before,.risk-wrap.caution .topbar::before{background:linear-gradient(90deg,transparent,#f5d000,transparent)}
.danger  .topbar::before,.risk-wrap.danger  .topbar::before{background:linear-gradient(90deg,transparent,#ff5f5f,transparent)}
.rug     .topbar::before,.risk-wrap.rug     .topbar::before{background:linear-gradient(90deg,transparent,#ff2244,transparent)}
.safe    .topbar::after,.risk-wrap.safe    .topbar::after{background:linear-gradient(90deg,transparent,rgba(0,229,176,.6),transparent)}
.caution .topbar::after,.risk-wrap.caution .topbar::after{background:linear-gradient(90deg,transparent,rgba(245,208,0,.6),transparent)}
.danger  .topbar::after,.risk-wrap.danger  .topbar::after{background:linear-gradient(90deg,transparent,rgba(255,95,95,.6),transparent)}
.rug     .topbar::after,.risk-wrap.rug     .topbar::after{background:linear-gradient(90deg,transparent,rgba(255,34,68,.7),transparent)}

/* logo colored by risk */
.safe    .logo{color:#00c890;text-shadow:0 0 10px rgba(0,229,176,.4)}
.caution .logo{color:#c8a800;text-shadow:0 0 10px rgba(245,208,0,.35)}
.danger  .logo{color:#cc5555;text-shadow:0 0 10px rgba(255,95,95,.4)}
.rug     .logo{color:#cc3344;text-shadow:0 0 12px rgba(255,34,68,.5)}

/* ── token header ── */
/* Row: left=verdict+name+age | right=token logo */
.token-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  margin-bottom:12px;
}
.token-header-text{
  flex:1;
  min-width:0;
}
/* Token logo top-right */
.token-logo{
  width:72px;
  height:72px;
  border-radius:50%;
  object-fit:cover;
  flex-shrink:0;
  background:#111;
  display:block;
  margin-top:4px;
}
.safe    .token-logo{border:1.5px solid rgba(0,229,176,.3);box-shadow:0 0 24px rgba(0,229,176,.18),0 0 48px rgba(0,229,176,.07)}
.caution .token-logo{border:1.5px solid rgba(245,208,0,.3);box-shadow:0 0 24px rgba(245,208,0,.15),0 0 48px rgba(245,208,0,.06)}
.danger  .token-logo{border:1.5px solid rgba(255,95,95,.3);box-shadow:0 0 24px rgba(255,95,95,.18),0 0 48px rgba(255,95,95,.07)}
.rug     .token-logo{border:1.5px solid rgba(255,34,68,.35);box-shadow:0 0 28px rgba(255,34,68,.22),0 0 56px rgba(255,34,68,.08)}

.vt{font-family:'Bebas Neue',sans-serif;font-size:72px;line-height:.85;letter-spacing:.03em;font-weight:400;position:relative}
.safe    .vt{color:#00e5b0;animation:ant-flicker-safe    3.5s ease-in-out infinite}
.caution .vt{color:#f5d000;animation:ant-flicker-caution 3.5s ease-in-out infinite}
.danger  .vt{color:#ff5f5f;animation:ant-flicker-danger  3.5s ease-in-out infinite}
.rug     .vt{color:#ff2244;animation:ant-flicker-rug     3s   ease-in-out infinite}

/* glitch for danger/rug */
.rug    .vt::before,.rug    .vt::after,
.danger .vt::before,.danger .vt::after{
  content:attr(data-label);
  position:absolute;left:0;top:0;
  font-family:'Bebas Neue',sans-serif;font-size:72px;line-height:.85;letter-spacing:.03em;
  animation:ant-glitch 7s infinite;pointer-events:none;
}
.rug    .vt::before{color:#ff2244;clip-path:polygon(0 30%,100% 30%,100% 50%,0 50%);transform:translateX(-2px);opacity:.5}
.rug    .vt::after {color:#ff2244;clip-path:polygon(0 58%,100% 58%,100% 72%,0 72%);transform:translateX(2px); opacity:.4;animation-delay:.15s}
.danger .vt::before{color:#ff5f5f;clip-path:polygon(0 30%,100% 30%,100% 50%,0 50%);transform:translateX(-2px);opacity:.4}
.danger .vt::after {color:#ff5f5f;clip-path:polygon(0 58%,100% 58%,100% 72%,0 72%);transform:translateX(2px); opacity:.3;animation-delay:.1s}

.tk-name{font-size:11px;color:#888;letter-spacing:.06em;margin-top:6px;line-height:1.4}
.tk-name b{color:#ddd;font-weight:700}
.age-badge{display:inline-block;font-size:10px;color:#666;background:#0a0a0c;border:1px solid #1e1e24;border-radius:2px;padding:3px 8px;margin-top:6px;letter-spacing:.06em}

/* price + score outside token-header, full width */
.price-big{font-size:22px;font-weight:700;color:#ddd;margin-top:14px;letter-spacing:.02em}
.price-big span{font-size:11px;color:#555}
.score-row{display:flex;align-items:center;gap:12px;margin:12px 0 4px}
.sc-num{font-size:11px;color:#666}
.sc-num b{color:#ddd;font-size:13px}
.sbar{flex:1;height:2px;background:#181818;border-radius:1px;overflow:hidden}
.sbar-f{height:100%;border-radius:1px;width:0%;transition:width 1.4s cubic-bezier(.22,1,.36,1)}
.safe    .sbar-f{background:linear-gradient(90deg,#00e5b055,#00e5b0);box-shadow:0 0 6px rgba(0,229,176,.5)}
.caution .sbar-f{background:linear-gradient(90deg,#f5d00044,#f5d000);box-shadow:0 0 6px rgba(245,208,0,.5)}
.danger  .sbar-f{background:linear-gradient(90deg,#ff5f5f44,#ff5f5f);box-shadow:0 0 6px rgba(255,95,95,.5)}
.rug     .sbar-f{background:linear-gradient(90deg,#ff224444,#ff2244);box-shadow:0 0 8px rgba(255,34,68,.6)}
.conf-line{font-size:10px;color:#555;letter-spacing:.06em;margin-top:4px}
.safe    .conf-line{color:#3a9070}
.caution .conf-line{color:#a89020}
.danger  .conf-line{color:#cc5555}
.rug     .conf-line{color:#cc4455}

.socials{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.soc{font-size:9px;color:#888;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;border-radius:2px;padding:5px 11px;transition:.2s;position:relative;overflow:hidden}
.soc::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);transform:translateX(-100%);transition:transform .5s}
.soc:hover::before{transform:translateX(100%)}
.safe    .soc{border:1px solid rgba(0,229,176,.12)}
.safe    .soc:hover{color:#00e5b0;border-color:rgba(0,229,176,.35)}
.caution .soc{border:1px solid rgba(245,208,0,.12)}
.caution .soc:hover{color:#f5d000;border-color:rgba(245,208,0,.35)}
.danger  .soc{border:1px solid rgba(255,95,95,.12)}
.danger  .soc:hover{color:#ff5f5f;border-color:rgba(255,95,95,.35)}
.rug     .soc{border:1px solid rgba(255,34,68,.15)}
.rug     .soc:hover{color:#ff2244;border-color:rgba(255,34,68,.4)}

/* ── cards ── */
.card{background:#0c0c0e;border:1px solid #1e1e24;border-radius:3px;padding:18px 20px;margin-bottom:10px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent)}
.card-title{font-size:8px;color:#555;letter-spacing:.3em;text-transform:uppercase;margin-bottom:14px}

.grid{display:grid;gap:8px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g4{grid-template-columns:1fr 1fr 1fr 1fr}
.stat{background:#090909;border:1px solid #1a1a1e;border-radius:2px;padding:11px 13px}
.stat span{display:block;font-size:8px;color:#555;letter-spacing:.18em;text-transform:uppercase;margin-bottom:4px}
.stat strong{font-size:15px;color:#ddd;font-weight:700}
.stat strong.up{color:#00e5b0;text-shadow:0 0 6px rgba(0,229,176,.3)}
.stat strong.dn{color:#ff5f5f;text-shadow:0 0 6px rgba(255,95,95,.3)}
.stat strong.neu{color:#888}

.changes{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:8px}
.ch{background:#090909;border:1px solid #1a1a1e;border-radius:2px;padding:9px 12px;text-align:center}
.ch span{display:block;font-size:8px;color:#555;letter-spacing:.18em;text-transform:uppercase;margin-bottom:3px}
.ch b{font-size:14px;font-weight:700}
.ch b.up{color:#00e5b0;text-shadow:0 0 8px rgba(0,229,176,.3)}
.ch b.dn{color:#ff5f5f;text-shadow:0 0 8px rgba(255,95,95,.3)}
.ch b.neu{color:#555}

.txn-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.txn{background:#090909;border:1px solid #1a1a1e;border-radius:2px;padding:10px 13px}
.txn span{display:block;font-size:8px;color:#555;letter-spacing:.18em;text-transform:uppercase;margin-bottom:6px}
.txn-line{display:flex;gap:5px;align-items:baseline;margin-bottom:8px}
.txn-buy{font-size:18px;color:#00e5b0;font-weight:700;text-shadow:0 0 10px rgba(0,229,176,.4);letter-spacing:.02em}
.txn-sep{font-size:13px;color:#333}
.txn-sell{font-size:18px;color:#ff5f5f;font-weight:700;text-shadow:0 0 10px rgba(255,95,95,.4);letter-spacing:.02em}
.txn-bar-wrap{display:flex;height:3px;border-radius:2px;overflow:hidden;gap:1px}
.txn-bar-buy{background:#00e5b0;border-radius:2px 0 0 2px;box-shadow:0 0 4px rgba(0,229,176,.4)}
.txn-bar-sell{background:#ff5f5f;border-radius:0 2px 2px 0;box-shadow:0 0 4px rgba(255,95,95,.4)}

.strip{display:flex;border-radius:3px;overflow:hidden}
.safe    .strip{background:#090b0a;border:1px solid rgba(0,229,176,.1)}
.caution .strip{background:#0a0a08;border:1px solid rgba(245,208,0,.08)}
.danger  .strip{background:#0a0909;border:1px solid rgba(255,95,95,.1)}
.rug     .strip{background:#0a0808;border:1px solid rgba(255,34,68,.12)}
.si{flex:1;text-align:center;padding:11px 4px;position:relative}
.si+.si::before{content:'';position:absolute;left:0;top:20%;height:60%;width:1px}
.safe    .si+.si::before{background:rgba(0,229,176,.1)}
.caution .si+.si::before{background:rgba(245,208,0,.08)}
.danger  .si+.si::before{background:rgba(255,95,95,.1)}
.rug     .si+.si::before{background:rgba(255,34,68,.1)}
.si span{display:block;font-size:8px;color:#777;letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px}
.si b{font-size:12px;font-weight:700}
.si b.y{color:#00e5b0;text-shadow:0 0 8px rgba(0,229,176,.4)}
.si b.n{color:#ff5f5f;text-shadow:0 0 8px rgba(255,95,95,.4)}
.si b.w{color:#f5d000;text-shadow:0 0 6px rgba(245,208,0,.4)}

.flag-list{display:flex;flex-direction:column}
.fl{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.03);font-size:12px;line-height:1.5}
.fl:last-child{border-bottom:none}
.fic{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;flex-shrink:0;margin-top:2px}
.fic.r{background:rgba(255,60,80,.15);color:#ff5f5f}
.fic.y{background:rgba(245,208,0,.12);color:#f5d000}
.fic.g{background:rgba(0,229,176,.1);color:#00e5b0}
.fl.cr .fl-txt{color:#e07070}
.fl.wr .fl-txt{color:#d4b040}
.fl.ok .fl-txt{color:#559970}

.src-row{display:flex;justify-content:space-between;font-size:11px;color:#666;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.src-row:last-child{border-bottom:none}
.src-row span:first-child{color:#aaa}
.src-row span:last-child{color:#00e5b0;text-shadow:0 0 6px rgba(0,229,176,.3)}

.footer{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-block;padding:10px 18px;font-size:9px;color:#aaa;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;border-radius:2px;transition:.2s;font-family:'IBM Plex Mono',monospace;position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);transform:translateX(-100%);transition:transform .5s}
.btn:hover::before{transform:translateX(100%)}
.safe    .btn,.safe-btn   {border:1px solid rgba(0,229,176,.12)}
.caution .btn,.caution-btn{border:1px solid rgba(245,208,0,.12)}
.danger  .btn,.danger-btn {border:1px solid rgba(255,95,95,.12)}
.rug     .btn,.rug-btn    {border:1px solid rgba(255,34,68,.15)}
.safe    .btn:hover{color:#00e5b0;border-color:rgba(0,229,176,.4)}
.caution .btn:hover{color:#f5d000;border-color:rgba(245,208,0,.4)}
.danger  .btn:hover{color:#ff5f5f;border-color:rgba(255,95,95,.4)}
.rug     .btn:hover{color:#ff2244;border-color:rgba(255,34,68,.5)}
.btn.warn{border-color:rgba(255,95,95,.2);color:#cc5555}
.btn.warn:hover{border-color:#ff5f5f;color:#ff5f5f;background:rgba(255,95,95,.04)}

.dots{display:flex;gap:3px;align-items:center}
.dt{width:5px;height:5px;border-radius:50%}
.dt.off{background:#222226}
.safe    .dt.on{background:#00e5b0;box-shadow:0 0 6px rgba(0,229,176,.6)}
.caution .dt.on{background:#f5d000;box-shadow:0 0 6px rgba(245,208,0,.6)}
.danger  .dt.on{background:#ff5f5f;box-shadow:0 0 6px rgba(255,95,95,.6)}
.rug     .dt.on{background:#ff2244;box-shadow:0 0 6px rgba(255,34,68,.7)}

#loading{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:100px;color:#444;font-size:10px;letter-spacing:.12em}
.spin{width:28px;height:28px;border:2px solid #1a1a1e;border-top-color:#333;border-radius:50%;animation:sp .7s linear infinite}
#loading-status{font-size:9px;color:#333;letter-spacing:.1em;min-height:14px}
#err{display:none;color:#ff5f5f;font-size:11px;margin-top:100px;text-align:center}
#err-retry{display:none;margin-top:12px;padding:8px 18px;font-size:9px;color:#888;letter-spacing:.12em;text-transform:uppercase;border:1px solid #333;border-radius:2px;background:none;cursor:pointer;font-family:'IBM Plex Mono',monospace;transition:.2s}
#err-retry:hover{color:#ccc;border-color:#666}
#content{display:none}

/* ── Flag descriptions ── */
.f-body { display: flex; flex-direction: column; gap: 2px; }
.flag-desc { font-size: 9.5px; color: #555; line-height: 1.45; font-style: italic; }

/* ── AI Summary card ── */
.ai-card { border-color: rgba(167,139,250,.2) !important; }
.ai-card .card-title { color: #a78bfa; }
.ai-icon { color: #a78bfa; margin-right: 4px; }
.ai-body { font-size: 12px; line-height: 1.7; color: #9a8fbf; margin-top: 10px; }
.ai-loading { font-size: 11px; color: #555; letter-spacing: .06em; animation: pulse 1.2s ease-in-out infinite; }

/* ── On-Chain grid ── */
.oc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin-top: 10px; }
.oc-item { display: flex; flex-direction: column; gap: 3px; }
.oc-label { font-size: 9px; color: #555; text-transform: uppercase; letter-spacing: .08em; }
.oc-val { font-size: 13px; color: #ccc; font-weight: 600; }

/* ── Creator ── */
.creator-link {
  display: flex; align-items: center; gap: 8px; margin-top: 10px;
  padding: 8px 10px; background: #0a0a0c; border-radius: 4px;
  border: 1px solid #1a1a1e; text-decoration: none; transition: .2s;
}
.creator-link:hover { border-color: rgba(0,229,176,.3); }
.creator-addr { font-size: 11px; color: #888; font-family: 'IBM Plex Mono', monospace; }
.creator-ext { font-size: 9px; color: #444; margin-left: auto; }

/* ── Layers ── */
.layer-row {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 0; border-bottom: 1px solid #111114;
}
.layer-row:last-child { border: none; }
.layer-name { font-size: 10px; color: #666; width: 88px; flex-shrink: 0; }
.layer-bar-wrap { flex: 1; height: 4px; background: #1a1a1e; border-radius: 2px; overflow: hidden; }
.layer-bar { height: 100%; border-radius: 2px; width: 0%; transition: width .9s cubic-bezier(.22,1,.36,1); }
.layer-bar.layer-ok   { background: linear-gradient(90deg, #00e5b055, #00e5b0); }
.layer-bar.layer-warn { background: linear-gradient(90deg, #f5d00055, #f5d000); }
.layer-bar.layer-bad  { background: linear-gradient(90deg, #ff224455, #ff2244); }
.layer-pct { font-size: 10px; width: 34px; text-align: right; font-weight: 600; }
.layer-pct.layer-ok   { color: #00e5b0; }
.layer-pct.layer-warn { color: #f5d000; }
.layer-pct.layer-bad  { color: #ff2244; }
.layer-unavail { font-size: 9px; color: #333; flex: 1; }
</style></head>
<body>
<canvas id="bg"></canvas>
<div class="wrap">
  <div class="hdr">
    <span class="logo">Antares</span>
    <span class="ca-badge" id="ca-disp">&mdash;</span>
  </div>
  <div id="loading">
    <div class="spin"></div>
    LOADING ANALYSIS
    <span id="loading-status"></span>
  </div>
  <div id="err">
    <div id="err-msg">Analysis failed. Please try again.</div>
    <button id="err-retry">↺ Retry</button>
  </div>
  <div id="content"></div>
</div>

<script>
const API="https://antares-extension.vercel.app/api/scan"
const MAX_RETRIES=3
const RETRY_DELAYS=[1000,2000]

function fmt(n){
  if(n==null)return"—"
  if(n>=1e9)return`$${(n/1e9).toFixed(2)}B`
  if(n>=1e6)return`$${(n/1e6).toFixed(2)}M`
  if(n>=1e3)return`$${(n/1e3).toFixed(1)}K`
  return`$${n.toFixed(0)}`
}
function pct(n){
  if(n==null)return{txt:"—",cls:"neu"}
  const s=n>0?"+":""
  const cls=n>0?"up":n<0?"dn":"neu"
  return{txt:`${s}${n.toFixed(2)}%`,cls}
}
function age(h){
  if(!h)return null
  if(h<24)return`${Math.round(h)}h old`
  const d=Math.floor(h/24)
  if(d<30)return`${d}d old`
  return`${Math.floor(d/30)}mo old`
}
function fmtPrice(p){
  if(!p)return"—"
  const n=parseFloat(p)
  if(n<0.000001)return`$${n.toExponential(2)}`
  if(n<0.01)return`$${n.toFixed(6)}`
  if(n<1)return`$${n.toFixed(4)}`
  return`$${n.toFixed(2)}`
}

function formatAge(hours) {
  if (!hours && hours !== 0) return null
  if (hours < 1) return Math.round(hours * 60) + 'm'
  if (hours < 24) return Math.round(hours) + 'h'
  const days = Math.floor(hours / 24)
  const rem = Math.round(hours % 24)
  return rem > 0 ? `${days}d ${rem}h` : `${days}d`
}

function escapeHtml(str) {
  if (!str) return ''
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
}

const FLAG_DESCRIPTIONS = {
  "Mint Authority enabled": "The dev can print unlimited new tokens and dump them on you at any time.",
  "Mint Authority enabled (RugCheck)": "The dev can print unlimited new tokens and dump them on you at any time.",
  "Freeze Authority enabled": "The dev can freeze your wallet and prevent you from selling.",
  "Freeze Authority enabled (RugCheck)": "The dev can freeze your wallet and prevent you from selling.",
  "LP not burned or locked": "The dev can pull all liquidity in one transaction and crash the price to zero.",
  "LP not burned but token is mature and liquid (unverified LP)": "Liquidity is not locked — the dev can still rug at any time.",
  "Honeypot detected — cannot sell": "You cannot sell this token. Any funds spent are gone.",
  "Bundle activity detected": "Coordinated wallets bought together to fake demand — classic pump and dump setup.",
  "Bundle holds": "A coordinated group controls a large portion of supply and can dump at will.",
  "Sniper activity detected": "Bots bought massively at launch before anyone else could — supply is concentrated.",
  "Top 10 holders > 70%": "Ten wallets control over 70% of the supply. If they sell together, the price collapses.",
  "Top 10 holders > 50%": "Half the supply is in 10 wallets — high dump risk.",
  "Single wallet holds": "One wallet controls a huge portion of supply and can crash the price alone.",
  "Metadata mutable": "The dev can change the token name, symbol and logo after launch — common in rug setups.",
  "No website / Twitter / Telegram": "Zero social presence — the team can disappear without any trace.",
  "Wash trading detected": "The trading volume is fake — bots trading with themselves to create false activity.",
  "Sell tax": "A hidden fee is taken every time you sell — often used to bleed holders slowly.",
  "Buy tax": "A fee is taken on every purchase — used to fund the dev or prevent exits.",
  "Owner holds > 5%": "The owner wallet holds a large stake and can dump it at any time.",
  "Creator holds > 5%": "The creator wallet holds a large stake and can dump it at any time.",
  "Blacklist capability": "The dev can blacklist specific wallets and prevent them from selling.",
  "Transfer pausable": "The dev can pause all transfers, trapping everyone's funds.",
  "Hidden owner": "The real owner of the contract is hidden — a known red flag for rug pulls.",
  "Upgradeable/proxy contract": "The contract code can be replaced after launch — any security audit becomes worthless.",
  "LP Burned ✓": "The liquidity is permanently burned. The dev cannot pull it.",
  "Well distributed supply ✓": "The token supply is well spread across many wallets — good sign.",
  "Strong holder base (5K+) ✓": "Over 5000 holders — strong community adoption signal.",
  "Established token (30d+) ✓": "The token has survived over 30 days — most rugs die within hours.",
}

function getFlagDescription(label) {
  if (FLAG_DESCRIPTIONS[label]) return FLAG_DESCRIPTIONS[label]
  for (const key of Object.keys(FLAG_DESCRIPTIONS)) {
    if (label.toLowerCase().startsWith(key.toLowerCase())) return FLAG_DESCRIPTIONS[key]
  }
  return null
}

const params=new URLSearchParams(location.search)
const CA_RE=/^[1-9A-HJ-NP-Za-km-z]{32,44}$/
const _raw=params.get("ca")||params.get("token")||""
const ca=CA_RE.test(_raw)?_raw:""
document.getElementById("ca-disp").textContent=ca?ca.slice(0,8)+"..."+ca.slice(-6):"—"

function setLoadingStatus(msg) {
  const el = document.getElementById('loading-status')
  if (el) el.textContent = msg
}

function showError(msg) {
  document.getElementById("loading").style.display="none"
  const errEl = document.getElementById("err")
  const msgEl = document.getElementById("err-msg")
  if (msgEl) msgEl.textContent = msg || "Analysis failed. Please try again."
  errEl.style.display="block"
  const retryBtn = document.getElementById("err-retry")
  if (retryBtn) retryBtn.style.display = "inline-block"
}

async function fetchWithRetry(url, attempt) {
  attempt = attempt || 1
  try {
    const r = await fetch(url)
    if (!r.ok) throw new Error('HTTP ' + r.status)
    return await r.json()
  } catch(e) {
    if (attempt >= MAX_RETRIES) throw e
    const delay = RETRY_DELAYS[attempt - 1] || 2000
    setLoadingStatus('Retrying... (' + attempt + '/' + MAX_RETRIES + ')')
    await new Promise(res => setTimeout(res, delay))
    return fetchWithRetry(url, attempt + 1)
  }
}

if(!ca){
  document.getElementById("loading").style.display="none"
  showError("No token address provided.")
} else {
  document.getElementById('err-retry').addEventListener('click', function() {
    document.getElementById('err').style.display = 'none'
    document.getElementById('loading').style.display = 'flex'
    setLoadingStatus('')
    fetchWithRetry(`${API}?ca=${ca}`)
      .then(d => render(d, ca))
      .catch(() => showError("Analysis failed after multiple attempts. Please try again later."))
  })

  fetchWithRetry(`${API}?ca=${ca}`)
    .then(d => render(d, ca))
    .catch(() => showError("Analysis failed after multiple attempts. Please try again later."))
}

function render(d,ca){
  document.getElementById("loading").style.display="none"
  const wrap=document.getElementById("content")
  wrap.style.display="block"

  const RC={SAFE:"safe",CAUTION:"caution",DANGER:"danger",RUG:"rug"}
  const LB={SAFE:"SAFE",CAUTION:"CAUTION",DANGER:"DANGER",RUG:"RUG PULL"}
  const rc=RC[d.risk]||"danger"
  const lb=LB[d.risk]||d.risk
  const score=d.score||0
  const barW=Math.min(100,Math.round(score/10))
  const conf=typeof d.confidence==="number"?d.confidence:null

  const mc=d.marketCap??d.pair?.marketCap??null
  const liq=d.liquidity??d.pair?.liquidity?.usd??null
  const vol24=d.volume24h??d.pair?.volume?.h24??null
  const vol1h=d.volume1h??d.pair?.volume?.h1??null
  const priceUsd=d.priceUsd??d.pair?.priceUsd??null
  const priceNative=d.pair?.priceNative??null

  const pc5m=d.priceChange5m??d.pair?.priceChange?.m5??null
  const pc1h=d.priceChange1h??d.pair?.priceChange?.h1??null
  const pc6h=d.pair?.priceChange?.h6??null
  const pc24h=d.priceChange24h??d.pair?.priceChange?.h24??null

  const txH1=d.pair?.txns?.h1??null
  const txH6=d.pair?.txns?.h6??null
  const txH24=d.pair?.txns?.h24??null

  const name=d.tokenName||d.pair?.baseToken?.name||""
  const sym=d.tokenSymbol||d.pair?.baseToken?.symbol||""
  const mint=d.resolvedMint||ca
  const logo=d.tokenLogo??d.pair?.info?.imageUrl??null
  const ageStr=age(d.solscanTokenAgeHours)
  const pairCreated=d.pairCreatedAt??d.pair?.pairCreatedAt??null

  const websites=d.pair?.info?.websites||[]
  const socials=d.pair?.info?.socials||[]

  const mintAuth=d.mintAuthority??null
  const freezeAuth=d.freezeAuthority??null
  const lpStatus=d.lpBurned===true?"BURN":d.lpLocked?"LOCK":"NO"
  const sellOk=d.honeypot===false||d.risk!=="RUG"

  const fAll=(d.flags||[]).filter(f=>f.severity!=="bonus")
  const fCrit=fAll.filter(f=>f.severity==="critical")
  let summary=fAll.length===0
    ?"All sources agree — no issues found"
    :fCrit.length>0
      ?`${fAll.length} flags — ${fCrit.length} critical — Conf. ${conf??""}%`
      :`${fAll.length} flags detected — Conf. ${conf??""}%`

  const flagsHtml=(d.flags||[])
    .filter(f=>{const l=f.label||f;return!l.toLowerCase().includes("unavailable")&&f.severity!=="bonus"})
    .map(f=>{
      const sev=f.severity||"warning"
      const isCrit=sev==="critical"
      const isBonus=sev==="bonus"
      const cls=isCrit?"cr":isBonus?"ok":"wr"
      const ic=isCrit?"r":isBonus?"g":"y"
      const ico=isCrit?"✕":isBonus?"✓":"!"
      const desc=getFlagDescription(f.label||f)
      return`<div class="fl ${cls}"><div class="fic ${ic}">${ico}</div><div class="f-body"><span class="fl-txt">${escapeHtml(f.label||f)}</span>${desc?`<div class="flag-desc">${escapeHtml(desc)}</div>`:''}</div></div>`
    }).join("")
  const noFlags=flagsHtml===""
    ?`<div class="fl ok"><div class="fic g">✓</div><div class="f-body"><span class="fl-txt">No critical flags detected</span></div></div>`
    :flagsHtml

  const c5=pct(pc5m),c1=pct(pc1h),c6=pct(pc6h),c24=pct(pc24h)
  const changesHtml=`
    <div class="changes">
      <div class="ch"><span>5 min</span><b class="${c5.cls}">${c5.txt}</b></div>
      <div class="ch"><span>1 hour</span><b class="${c1.cls}">${c1.txt}</b></div>
      <div class="ch"><span>6 hours</span><b class="${c6.cls}">${c6.txt}</b></div>
      <div class="ch"><span>24 hours</span><b class="${c24.cls}">${c24.txt}</b></div>
    </div>`

  function txnCard(label,txObj){
    if(!txObj)return""
    const total=txObj.buys+txObj.sells||1
    const buyPct=Math.round(txObj.buys/total*100)
    const sellPct=100-buyPct
    return`<div class="txn">
      <span>${label}</span>
      <div class="txn-line"><span class="txn-buy">${txObj.buys}B</span><span class="txn-sep">/</span><span class="txn-sell">${txObj.sells}S</span></div>
      <div class="txn-bar-wrap"><div class="txn-bar-buy" style="width:${buyPct}%"></div><div class="txn-bar-sell" style="width:${sellPct}%"></div></div>
    </div>`
  }

  const dotsCount=Math.round((score/1000)*5)
  const dotsHtml=Array.from({length:5},(_,i)=>`<div class="dt ${i<dotsCount?'on':'off'}"></div>`).join("")

  const siSell=`<div class="si"><span>Sell</span><b class="${sellOk?'y':'n'}">${sellOk?'✓':'✕'}</b></div>`
  const siMint=`<div class="si"><span>Mint</span><b class="${mintAuth?'n':'y'}">${mintAuth?'ON':'OFF'}</b></div>`
  const siFreeze=`<div class="si"><span>Freeze</span><b class="${freezeAuth?'n':'y'}">${freezeAuth?'ON':'OFF'}</b></div>`
  const siLP=`<div class="si"><span>LP</span><b class="${lpStatus==='NO'?'n':lpStatus==='BURN'?'y':'w'}">${lpStatus}</b></div>`
  const siLiq=liq?`<div class="si"><span>Liq</span><b class="${liq<5000?'n':liq<30000?'w':'y'}">${fmt(liq)}</b></div>`:""
  const siConf=conf!==null?`<div class="si"><span>Conf.</span><b class="${conf<50?'n':conf<80?'w':'y'}">${conf}%</b></div>`:""

  const FIXED_SOURCES=["DexScreener","RugCheck","GoPlus","Helius"]
  const apiSources=Array.isArray(d.sources_used)?d.sources_used:[]
  const allSources=[...new Map([...FIXED_SOURCES,...apiSources].map(s=>[s.toLowerCase(),s])).values()]
  const sourcesHtml=allSources
    .map(s=>`<div class="src-row"><span>${s}</span><span>✓ used</span></div>`).join("")

  function safeUrl(u){return typeof u==='string'&&/^https?:\/\//i.test(u)?u:'#'}
  const socialsHtml=[
    ...websites.map(w=>`<a class="soc" href="${safeUrl(w.url)}" target="_blank" rel="noopener">${w.label||'Website'}</a>`),
    ...socials.map(s=>`<a class="soc" href="${safeUrl(s.url)}" target="_blank" rel="noopener">${s.type}</a>`)
  ].join("")

  const pairDate=pairCreated?new Date(pairCreated).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):null
  const dexUrl=d.pair?.url||`https://dexscreener.com/solana/${ca}`

  window.__riskClass=rc

  // ── Logo token (top-right) — shown if available
  const logoHtml=logo
    ?`<img class="token-logo" src="${logo}" alt="${escapeHtml(sym)}" onerror="this.style.display='none'"/>`
    :""

  // ── tk-name: symbol + full name, properly closed
  const tkNameHtml=sym
    ?`<div class="tk-name"><b>${escapeHtml(sym)}</b>${name?' '+escapeHtml(name):''}</div>`
    :""

  // ── age badge
  const ageBadgeHtml=ageStr
    ?`<div class="age-badge">${ageStr}</div>`
    :pairDate?`<div class="age-badge">Pair: ${pairDate}</div>`:""

  wrap.innerHTML=`
    <div class="${rc}">
      <div class="risk-wrap ${rc}">
        <div class="topbar"></div>

        <!-- verdict + name + age on the left, token logo on the right -->
        <div class="token-header">
          <div class="token-header-text">
            <div class="vt" data-label="${escapeHtml(lb)}">${lb}</div>
            ${tkNameHtml}
            ${ageBadgeHtml}
          </div>
          ${logoHtml}
        </div>

        <!-- price, score bar and confidence BELOW the header row, full width -->
        ${priceUsd?`<div class="price-big">${fmtPrice(priceUsd)} <span>${priceNative?priceNative+' SOL':''}</span></div>`:""}
        <div class="score-row">
          <span class="sc-num"><b>${score}</b> / 1000</span>
          <div class="dots">${dotsHtml}</div>
          <div class="sbar"><div class="sbar-f" id="sbarf"></div></div>
        </div>
        <div class="conf-line">${summary}</div>
        ${socialsHtml?`<div class="socials">${socialsHtml}</div>`:""}
      </div>
    </div>

    <div class="card">
      <div class="card-title">Market Data</div>
      <div class="grid g4">
        ${mc?`<div class="stat"><span>Market Cap</span><strong>${fmt(mc)}</strong></div>`:""}
        ${liq?`<div class="stat"><span>Liquidity</span><strong>${fmt(liq)}</strong></div>`:""}
        ${vol24?`<div class="stat"><span>Volume 24h</span><strong>${fmt(vol24)}</strong></div>`:""}
        ${vol1h?`<div class="stat"><span>Volume 1h</span><strong>${fmt(vol1h)}</strong></div>`:""}
      </div>
      ${changesHtml}
    </div>

    <div class="card">
      <div class="card-title">Security</div>
      <div class="strip">${siSell}${siMint}${siFreeze}${siLP}${siLiq}${siConf}</div>
    </div>

    <div class="card">
      <div class="card-title">Sources</div>
      <div>${sourcesHtml}</div>
    </div>

    <div class="footer">
      <a class="btn" href="${dexUrl}" target="_blank" rel="noopener">↗ DexScreener</a>
      <a class="btn" href="https://solscan.io/token/${mint}" target="_blank" rel="noopener">↗ Solscan</a>
      <a class="btn warn" href="https://rugcheck.xyz/tokens/${mint}" target="_blank" rel="noopener">⚠ RugCheck</a>
    </div>
  `

  // ── AI Analysis card
  const aiSection = document.createElement('div')
  aiSection.className = 'card ai-card'
  aiSection.id = 'ai-section'
  if (d.aiSummary) {
    aiSection.innerHTML = `<div class="card-title"><span class="ai-icon">⬡</span> AI Analysis</div><p class="ai-body">${escapeHtml(d.aiSummary)}</p>`
  } else {
    aiSection.innerHTML = `<div class="card-title"><span class="ai-icon">⬡</span> AI Analysis</div><p class="ai-loading">Generating analysis…</p>`
    fetch(`${API}?ca=${ca}&ai=1`)
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (data && data.aiSummary) {
          const p = aiSection.querySelector('.ai-loading, .ai-body')
          if (p) { p.className = 'ai-body'; p.textContent = data.aiSummary }
        } else {
          const p = aiSection.querySelector('.ai-loading')
          if (p) { p.className = 'ai-body'; p.style.animation = 'none'; p.style.color = '#444'; p.textContent = 'AI analysis unavailable for this token.' }
        }
      })
      .catch(() => {
        const p = aiSection.querySelector('.ai-loading')
        if (p) { p.className = 'ai-body'; p.style.animation = 'none'; p.style.color = '#444'; p.textContent = 'AI analysis unavailable for this token.' }
      })
  }
  const firstCard = wrap.querySelector('.card')
  if (firstCard) { wrap.insertBefore(aiSection, firstCard) } else { wrap.appendChild(aiSection) }

  // ── Flags card
  const flagsSection = document.createElement('div')
  flagsSection.className = 'card'
  flagsSection.innerHTML = `<div class="card-title">Flags</div><div class="flag-list">${noFlags}</div>`
  const secCard = wrap.querySelector('.card:nth-child(3)')
  if (secCard) { secCard.after(flagsSection) } else { wrap.insertBefore(flagsSection, wrap.querySelector('.footer')) }

  // ── On-Chain Data
  const onchainRows = [
    d.holders         != null && ['Holders',      d.holders.toLocaleString()],
    d.marketCap       != null && ['Market Cap',    fmt(d.marketCap)],
    d.liquidity       != null && ['Liquidity',     fmt(d.liquidity)],
    d.volume24h       != null && ['Volume 24h',    fmt(d.volume24h)],
    d.solscanTrades24h  != null && ['Trades 24h',  d.solscanTrades24h.toLocaleString()],
    d.solscanTraders24h != null && ['Traders 24h', d.solscanTraders24h.toLocaleString()],
    d.solscanTokenAgeHours != null && ['Token Age', formatAge(d.solscanTokenAgeHours)],
    d.priceChange1h   != null && ['Chg 1h',  (d.priceChange1h  >= 0 ? '+' : '') + d.priceChange1h.toFixed(1)  + '%'],
    d.priceChange24h  != null && ['Chg 24h', (d.priceChange24h >= 0 ? '+' : '') + d.priceChange24h.toFixed(1) + '%'],
  ].filter(Boolean)

  if (onchainRows.length > 0) {
    const ocCard = document.createElement('div')
    ocCard.className = 'card'
    ocCard.innerHTML = `
      <div class="card-title">On-Chain Data</div>
      <div class="oc-grid">
        ${onchainRows.map(([label, val]) => `
          <div class="oc-item">
            <span class="oc-label">${label}</span>
            <strong class="oc-val">${val}</strong>
          </div>`).join('')}
      </div>`
    wrap.insertBefore(ocCard, wrap.querySelector('.footer'))
  }

  // ── Creator
  if (d.tokenCreator) {
    const creatorCard = document.createElement('div')
    creatorCard.className = 'card'
    const solscanUrl = `https://solscan.io/account/${d.tokenCreator}`
    creatorCard.innerHTML = `
      <div class="card-title">Token Creator</div>
      <a href="${solscanUrl}" target="_blank" rel="noopener noreferrer" class="creator-link">
        <span class="creator-addr">${d.tokenCreator.slice(0,8)}…${d.tokenCreator.slice(-8)}</span>
        <span class="creator-ext">↗ Solscan</span>
      </a>`
    wrap.insertBefore(creatorCard, wrap.querySelector('.footer'))
  }

  // ── Layers / Trust par Source
  const SOURCE_LABELS = {
    dexscreener: 'DexScreener', rugcheck: 'RugCheck', goplus: 'GoPlus',
    helius: 'Helius', solscan: 'Solscan', chart: 'Chart'
  }

  if (d.layers) {
    const layerEntries = Object.entries(d.layers).filter(([src]) => src !== 'crossvalidation')
    if (layerEntries.length > 0) {
      const layersCard = document.createElement('div')
      layersCard.className = 'card'
      const rows = layerEntries.map(([src, l]) => {
        const pct = Math.round(l.trust * 100)
        const colorCls = !l.available ? 'layer-na' : pct >= 75 ? 'layer-ok' : pct >= 40 ? 'layer-warn' : 'layer-bad'
        const label = SOURCE_LABELS[src] || src
        if (!l.available) {
          return `<div class="layer-row">
            <span class="layer-name">${label}</span>
            <span class="layer-unavail">Unavailable</span>
          </div>`
        }
        return `<div class="layer-row">
          <span class="layer-name">${label}</span>
          <div class="layer-bar-wrap">
            <div class="layer-bar ${colorCls}" style="width:0%" data-w="${pct}"></div>
          </div>
          <span class="layer-pct ${colorCls}">${pct}%</span>
        </div>`
      }).join('')
      layersCard.innerHTML = `<div class="card-title">Trust par Source</div>${rows}`
      wrap.insertBefore(layersCard, wrap.querySelector('.footer'))

      requestAnimationFrame(() => {
        layersCard.querySelectorAll('.layer-bar[data-w]').forEach(bar => {
          setTimeout(() => { bar.style.width = bar.dataset.w + '%' }, 300)
        })
      })
    }
  }

  const logoColors={safe:'#00c890',caution:'#c8a800',danger:'#cc5555',rug:'#cc3344'}
  const logoGlow={safe:'rgba(0,229,176,.4)',caution:'rgba(245,208,0,.35)',danger:'rgba(255,95,95,.4)',rug:'rgba(255,34,68,.5)'}
  const logoEl=document.querySelector('.logo')
  if(logoEl){logoEl.style.color=logoColors[rc]||'#444';logoEl.style.textShadow=`0 0 10px ${logoGlow[rc]||'transparent'}`}

  setTimeout(()=>{
    const b=document.getElementById("sbarf")
    if(b)b.style.width=barW+"%"
  },300)
}
</script>

<script>
;(()=>{
  const C=document.getElementById("bg")
  const ctx=C.getContext("2d")
  let W,H,pts=[]
  const N=60,CONN=140,SPEED=.35
  function resize(){W=C.width=window.innerWidth;H=C.height=window.innerHeight}
  resize();window.addEventListener("resize",resize)
  for(let i=0;i<N;i++)pts.push({x:Math.random()*1400,y:Math.random()*900,vx:(Math.random()-.5)*SPEED,vy:(Math.random()-.5)*SPEED,r:Math.random()*1.5+.5})
  const riskColors={
    safe:'rgba(0,229,176,.18)',
    caution:'rgba(245,208,0,.18)',
    danger:'rgba(255,95,95,.18)',
    rug:'rgba(255,34,68,.2)'
  }
  const riskLineColors={
    safe:  (a)=>`rgba(0,229,176,${a})`,
    caution:(a)=>`rgba(245,208,0,${a})`,
    danger: (a)=>`rgba(255,95,95,${a})`,
    rug:    (a)=>`rgba(255,34,68,${a})`
  }
  function draw(){
    const rc=window.__riskClass||'safe'
    const dotColor=riskColors[rc]||riskColors.safe
    const lineColor=riskLineColors[rc]||riskLineColors.safe
    ctx.clearRect(0,0,W,H)
    for(const p of pts){
      p.x+=p.vx;p.y+=p.vy
      if(p.x<0||p.x>W)p.vx*=-1
      if(p.y<0||p.y>H)p.vy*=-1
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2)
      ctx.fillStyle=dotColor;ctx.fill()
    }
    for(let i=0;i<pts.length;i++){const p=pts[i];for(let j=i+1;j<pts.length;j++){const q=pts[j];const d2=(p.x-q.x)**2+(p.y-q.y)**2;if(d2>CONN*CONN)continue;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle=lineColor(0.08*(1-d2/(CONN*CONN)));ctx.stroke()}}
    requestAnimationFrame(draw)
  }
  draw()
})()
</script>
</body></html>
