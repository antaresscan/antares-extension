<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Antares — Token Analysis</title>
<meta name="description" content="Antares scans Solana tokens in real time — detects rug pulls, honeypots, bundlers and chart manipulation directly in your browser.">
<meta property="og:title" content="Antares — Token Analysis">
<meta property="og:description" content="Real-time Solana token security scanner. Detects rug pulls, honeypots, bundlers and chart manipulation.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://antares-extension.vercel.app/token.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Antares — Token Analysis">
<meta name="twitter:description" content="Real-time Solana token security scanner. Detects rug pulls, honeypots, bundlers and chart manipulation.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0c">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600;700&display=swap"></noscript>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --c:#00e5b0;--bg:#0a0a0c;--card:#111114;--border:#1a1a1e;--dim:#3a3a3f;--txt:#c8c8cc;
  --red:#ff2244;--orange:#ff5f5f;--yellow:#f5d000;--purple:#a78bfa;--cyan:#22d3ee;--glow:rgba(0,229,176,.12);
  /* Risk-driven design tokens — overridden per body.risk-* below */
  --risk:#00e5b0;
  --risk-soft:rgba(0,229,176,.045);
  --risk-glow:rgba(0,229,176,.18);
  --risk-fill:rgba(0,229,176,.55);
  --risk-border:rgba(0,229,176,.22);
}
body.risk-safe   {--risk:#00e5b0;--risk-soft:rgba(0,229,176,.045);--risk-glow:rgba(0,229,176,.18);--risk-fill:rgba(0,229,176,.55);--risk-border:rgba(0,229,176,.22)}
body.risk-caution{--risk:#f5d000;--risk-soft:rgba(245,208,0,.04);--risk-glow:rgba(245,208,0,.15);--risk-fill:rgba(245,208,0,.55);--risk-border:rgba(245,208,0,.22)}
body.risk-danger {--risk:#ff5f5f;--risk-soft:rgba(255,95,95,.045);--risk-glow:rgba(255,95,95,.18);--risk-fill:rgba(255,95,95,.55);--risk-border:rgba(255,95,95,.22)}
body.risk-rug    {--risk:#ff2244;--risk-soft:rgba(255,34,68,.05);--risk-glow:rgba(255,34,68,.22);--risk-fill:rgba(255,34,68,.6);--risk-border:rgba(255,34,68,.25)}

html{scroll-behavior:smooth;cursor:crosshair}
body{background:var(--bg);color:var(--txt);font-family:'IBM Plex Mono',monospace;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at top,var(--risk-soft) 0%,transparent 60%);pointer-events:none;z-index:0;transition:background .6s}

.stripe{position:fixed;top:0;left:0;right:0;height:3px;z-index:999;background:linear-gradient(90deg,#c0007a,var(--c),#c8c000,#c0002a,var(--c),#c0007a);background-size:400% 100%;animation:stripe 6s linear infinite;opacity:.7}
@keyframes stripe{0%{background-position:0% 0}100%{background-position:400% 0}}
.cursor-glow{position:fixed;width:350px;height:350px;border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(circle,rgba(0,229,176,.06) 0%,transparent 70%);transform:translate(-50%,-50%);transition:opacity .3s;opacity:0}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.32}
.shell{position:relative;z-index:2;max-width:1140px;margin:0 auto;padding:0 32px 80px}

/* ── NAV (sticky, blurred, compact-mode on scroll) ── */
nav{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:16px 0;border-bottom:1px solid var(--border);position:sticky;top:3px;z-index:100;background:rgba(10,10,12,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:padding .25s}
nav.compact{padding:10px 0}
nav .brand{font:400 22px/1 'Bebas Neue',sans-serif;letter-spacing:.18em;color:#e0e0e0;text-decoration:none;display:flex;align-items:center;gap:10px;flex-shrink:0}
nav .brand img{height:24px;width:auto;filter:invert(1)}
nav .nav-mid{display:flex;align-items:center;gap:14px;opacity:0;transition:opacity .25s;pointer-events:none;flex:1;justify-content:center;min-width:0}
nav.compact .nav-mid{opacity:1;pointer-events:auto}
.nav-ticker{font-size:11px;color:#888;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.nav-ticker b{color:#ddd}
.nav-verdict{font:400 22px/1 'Bebas Neue',sans-serif;letter-spacing:.06em;color:var(--risk);flex-shrink:0}
.nav-score{font-size:11px;color:var(--risk);font-weight:600;letter-spacing:.04em;flex-shrink:0}
nav .actions{display:flex;gap:6px;flex-shrink:0;align-items:center}
.ca-pill{font-size:9px;color:#777;background:#0e0e10;border:1px solid #1e1e22;border-radius:2px;padding:6px 12px;letter-spacing:.06em}
nav .actions a{font-size:9px;color:var(--dim);border:1px solid #1e1e22;padding:6px 12px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;transition:all .25s;font-family:'IBM Plex Mono',monospace}
nav .actions a:hover{color:var(--c);border-color:rgba(0,229,176,.35);background:rgba(0,229,176,.04)}
nav .actions a.warn{color:#996060}
nav .actions a.warn:hover{color:var(--orange);border-color:rgba(255,95,95,.4);background:rgba(255,95,95,.04)}

/* ── Loading + error ── */
#loading{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:120px;color:#444;font-size:10px;letter-spacing:.12em}
.spin{width:28px;height:28px;border:2px solid #1a1a1e;border-top-color:var(--c);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#loading-status{font-size:9px;color:#333;letter-spacing:.1em;min-height:14px}
#err{display:none;color:var(--orange);font-size:11px;margin-top:120px;text-align:center}
#err-retry{display:none;margin-top:14px;padding:10px 22px;font-size:9px;color:#888;letter-spacing:.12em;text-transform:uppercase;border:1px solid #333;background:none;cursor:pointer;font-family:'IBM Plex Mono',monospace;transition:.2s}
#err-retry:hover{color:#ccc;border-color:#666}

/* ── HERO with ghost background text ── */
.hero{padding:48px 0 32px;position:relative;overflow:hidden}
.hero::before{content:attr(data-verdict);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font:400 320px/1 'Bebas Neue',sans-serif;color:var(--risk);opacity:.012;pointer-events:none;white-space:nowrap;letter-spacing:.06em;z-index:0}
.hero-eye{font:600 11px/1 'IBM Plex Mono',monospace;color:var(--risk);letter-spacing:.28em;text-transform:uppercase;display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.hero-eye::before{content:'';display:block;width:22px;height:2px;background:var(--risk);animation:pulse-line 2s ease infinite}
@keyframes pulse-line{0%,100%{opacity:.5;width:22px}50%{opacity:1;width:30px}}

.verdict-info{display:flex;flex-direction:column;gap:14px;min-width:0;position:relative;z-index:1;margin-top:16px}

/* Verdict h1 + token logo : justify-content:space-between → logo top-right */
.verdict-row{display:flex;justify-content:space-between;align-items:center;gap:24px}
.verdict-row h1{font:400 clamp(64px,8.5vw,108px)/.86 'Bebas Neue',sans-serif;letter-spacing:.04em;color:var(--risk);text-shadow:0 0 60px var(--risk-glow);word-break:break-word;flex:1;min-width:0;position:relative;animation:glitch-base 7s ease-in-out infinite}
.verdict-row h1::before,.verdict-row h1::after{content:attr(data-verdict);position:absolute;top:0;left:0;width:100%;height:100%;color:var(--risk);opacity:0;pointer-events:none}
.verdict-row h1::before{animation:glitch-r 7s ease-in-out infinite;color:var(--cyan);mix-blend-mode:screen}
.verdict-row h1::after{animation:glitch-l 7s ease-in-out infinite;color:var(--orange);mix-blend-mode:screen}
@keyframes glitch-base{0%,92%,100%{transform:translate(0)}93%{transform:translate(-1px,1px)}94%{transform:translate(1px,-1px)}95%{transform:translate(0,0)}}
@keyframes glitch-r{0%,92%,100%{opacity:0;transform:translate(0)}93%{opacity:.6;transform:translate(-3px,0)}94%{opacity:0;transform:translate(0)}}
@keyframes glitch-l{0%,92%,100%{opacity:0;transform:translate(0)}93%{opacity:.5;transform:translate(3px,0)}94%{opacity:0;transform:translate(0)}}
@media(max-width:600px){.verdict-row{flex-direction:column;align-items:flex-start;gap:14px}}

.tk-line{font-size:13px;color:#777;letter-spacing:.06em}
.tk-line b{color:#ddd;font-weight:700;font-size:14px}

.meta-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px}
.age-badge{font-size:10px;color:#666;background:#0e0e10;border:1px solid var(--border);border-radius:2px;padding:4px 10px;letter-spacing:.08em}
.soc{font-size:9px;color:#888;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;border:1px solid #1e1e22;border-radius:2px;padding:4px 10px;transition:all .2s;font-family:'IBM Plex Mono',monospace}
.soc:hover{color:var(--risk);border-color:var(--risk-border);background:var(--risk-soft)}

/* Logo wrap : fallback letters under the <img>; if image fails, onerror
   removes it and the fallback shows through. CSP allows https: in img-src. */
.token-logo-wrap{position:relative;width:80px;height:80px;border-radius:50%;border:1.5px solid var(--risk-border);box-shadow:0 0 28px var(--risk-glow);background:#111;overflow:hidden;flex-shrink:0}
.token-logo-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,var(--risk-soft) 50%,transparent 70%);animation:logo-shimmer 4s ease-in-out infinite;pointer-events:none;z-index:2}
@keyframes logo-shimmer{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}
.token-logo-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 16px 'IBM Plex Mono',monospace;color:#aaa}
.token-logo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}

/* ── Score + price metrics ── */
.metrics-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.m-card{background:var(--card);border:1px solid var(--border);padding:14px 16px;position:relative;overflow:hidden}
.m-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--risk-fill),transparent);opacity:.5}
.m-label-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:10px}
.m-label{font-size:9px;color:#444;letter-spacing:.18em;text-transform:uppercase}

/* Refresh button — manual cache bypass. 15s cooldown handled in JS. */
.refresh-btn{background:transparent;border:1px solid var(--border);color:var(--dim);width:24px;height:24px;border-radius:3px;cursor:pointer;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;transition:color .25s,border-color .25s,background .25s,transform .3s;font-family:'IBM Plex Mono',monospace;padding:0}
.refresh-btn:hover:not(:disabled){color:var(--c);border-color:rgba(0,229,176,.35);background:rgba(0,229,176,.04)}
.refresh-btn:disabled{opacity:.35;cursor:not-allowed}
.refresh-btn.spinning{animation:refresh-spin 1s linear infinite;color:var(--c);border-color:rgba(0,229,176,.35)}
@keyframes refresh-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.m-fresh{font-size:9px;color:#444;margin-top:8px;letter-spacing:.04em;font-family:'IBM Plex Mono',monospace}
.m-big{font:400 28px/1 'Bebas Neue',sans-serif;letter-spacing:.02em;color:#ddd}
.m-big.alt{color:var(--risk);text-shadow:0 0 18px var(--risk-glow)}
.m-big .denom{font-size:11px;color:#444;margin-left:3px}
.sbar{margin-top:8px;height:2px;background:#181818;border-radius:1px;overflow:hidden}
.sbar-fill{height:100%;background:linear-gradient(90deg,var(--risk-fill),var(--risk));box-shadow:0 0 6px var(--risk-glow);width:0;transition:width 1.4s cubic-bezier(.22,1,.36,1)}
.m-sub{font-size:10px;color:#666;letter-spacing:.04em;margin-top:5px}
.m-sub.up{color:var(--c)}.m-sub.dn{color:var(--orange)}.m-sub.risk{color:var(--risk);opacity:.85}
.spark{margin-top:6px;display:block}

/* ── SECTION labels (foldable: click to toggle next sibling) ── */
.section-label{display:flex;align-items:center;gap:14px;margin:40px 0 14px;cursor:pointer;user-select:none;transition:opacity .2s}
.section-label:hover{opacity:.85}
.section-label::before{content:'▸';font-size:9px;color:var(--c);transition:transform .25s}
.section-label.closed::before{transform:rotate(-90deg)}
.section-label > span:first-of-type{font-size:10px;color:#3a3a3f;letter-spacing:.24em;text-transform:uppercase;transition:color .2s}
.section-label:hover > span:first-of-type{color:#888}
.section-label .hr{flex:1;height:1px;background:var(--border)}
.section-label .chev{font-size:13px;color:#666;transition:transform .25s,color .2s;letter-spacing:0;line-height:1;padding:4px 6px;border:1px solid #1e1e22;border-radius:2px;background:#0e0e10;min-width:22px;text-align:center;font-family:'IBM Plex Mono',monospace}
.section-label:hover .chev{color:var(--c);border-color:rgba(0,229,176,.3)}
.section-label.closed .chev{transform:rotate(180deg)}

/* foldable bodies — uniform spacing whether folded or expanded */
.flags-card,.ai-card,.sec-strip,.deep,.holders-card,.mkt-grid,.oc-grid,.src-list,.whales-preview{transition:max-height .35s ease,opacity .2s,padding .25s,border-width .2s;max-height:5000px;overflow:hidden}
.flags-card.collapsed,.ai-card.collapsed,.sec-strip.collapsed,.deep.collapsed,.holders-card.collapsed,.mkt-grid.collapsed,.oc-grid.collapsed,.src-list.collapsed,.whales-preview.collapsed{max-height:0;opacity:0;border-width:0;padding-top:0!important;padding-bottom:0!important}

/* ── FLAGS card ── */
.flags-card{background:var(--risk-soft);border:1px solid var(--risk-border)}
.flags-head{padding:14px 20px 10px;border-bottom:1px solid rgba(255,255,255,.04);display:flex;justify-content:space-between;align-items:center}
.flags-head .lbl{font-size:9px;color:var(--risk);letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.flags-head .count{font-size:11px;color:#666;font-family:'IBM Plex Mono',monospace}
.flag-row{display:grid;grid-template-columns:18px 1fr 60px;gap:11px;padding:11px 20px;border-bottom:1px solid rgba(255,255,255,.025);align-items:center}
.flag-row:last-child{border:none}
.flag-icon{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex-shrink:0;margin-top:2px}
.flag-icon.r{background:rgba(255,60,80,.18);color:var(--orange)}
.flag-icon.y{background:rgba(245,208,0,.14);color:var(--yellow)}
.flag-icon.g{background:rgba(0,229,176,.12);color:var(--c)}
.flag-body{flex:1;min-width:0}
.flag-label{font-size:12px;font-weight:600;line-height:1.4;word-break:break-word}
.flag-label.cr{color:#e07070}.flag-label.wr{color:#d4b040}.flag-label.ok{color:#559970}
.flag-desc{font-size:10.5px;color:#666;line-height:1.5;margin-top:3px;font-style:italic}
.sev{display:flex;gap:3px;justify-content:flex-end}
.sev .d{width:6px;height:6px;border-radius:50%;background:#2a2a30;border:1px solid #1a1a1e}
.sev.s3 .d:nth-child(-n+3){background:var(--risk);box-shadow:0 0 4px var(--risk-glow)}
.sev.s2 .d:nth-child(-n+2){background:var(--orange)}
.sev.s1 .d:nth-child(-n+1){background:var(--yellow)}

/* ── AI verdict ── */
.ai-card{background:rgba(167,139,250,.04);border:1px solid rgba(167,139,250,.18);padding:18px 22px;position:relative}
.ai-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(167,139,250,.4),transparent)}
.ai-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ai-head .icon{font-size:14px;color:var(--purple)}
.ai-head h3{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--purple);font-weight:700;flex:1}
.ai-body{font-size:13px;line-height:1.7;color:#a89fc6;max-width:880px}
.ai-body b{color:#c4b5fd;font-weight:600}
.ai-loading{font-size:11px;color:#555;letter-spacing:.06em;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

/* ── SECURITY strip ── */
.sec-strip{display:grid;grid-template-columns:repeat(5,1fr);background:#09090b;border:1px solid var(--border)}
.sec-cell{text-align:center;padding:18px 8px;border-right:1px solid var(--border);position:relative}
.sec-cell:last-child{border-right:none}
.sec-cell .lbl{font-size:9px;color:#444;letter-spacing:.22em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:6px}
.sec-cell .lbl::before{content:'';width:5px;height:5px;border-radius:50%;background:#333}
.sec-cell.y .lbl::before{background:var(--c);box-shadow:0 0 4px rgba(0,229,176,.5)}
.sec-cell.n .lbl::before{background:var(--orange);box-shadow:0 0 4px rgba(255,95,95,.5)}
.sec-cell.w .lbl::before{background:var(--yellow);box-shadow:0 0 4px rgba(245,208,0,.5)}
.sec-cell .val{font:400 20px/1 'Bebas Neue',sans-serif;letter-spacing:.04em}
.sec-cell.y .val{color:var(--c)}.sec-cell.n .val{color:var(--orange)}.sec-cell.w .val{color:var(--yellow)}
.sec-cell.neu .val{color:#555}
@media(max-width:600px){.sec-strip{grid-template-columns:repeat(5,minmax(0,1fr))}.sec-cell{padding:14px 4px}.sec-cell .val{font-size:18px}}

/* ── DEEP ANALYSIS — TABS ── */
.deep{background:var(--card);border:1px solid var(--border)}
.tabs{display:flex;border-bottom:1px solid var(--border);background:#0a0a0c;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:fit-content;padding:14px 18px;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#555;background:transparent;border:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap}
.tab:hover{color:#aaa;background:rgba(255,255,255,.02)}
.tab.active{color:var(--c);border-bottom-color:var(--c);background:rgba(0,229,176,.03)}
.tab-icon{display:inline-flex;width:13px;height:13px;flex-shrink:0;align-items:center;justify-content:center}
.tab-icon svg{width:100%;height:100%;display:block}
.tab-content{padding:24px}
.tab-pane{display:none}
.tab-pane.active{display:block;animation:tab-in .3s ease}
@keyframes tab-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.tab-empty{padding:40px 20px;text-align:center;color:#555;font-size:11px;letter-spacing:.04em;line-height:1.7}
.tab-empty b{color:#888;font-weight:600}

/* === Critical Actors preview (3 cards) === */
.whales-preview{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wp-card{background:var(--card);border:1px solid var(--border);padding:14px 16px;position:relative;overflow:hidden;transition:.2s;cursor:default}
.wp-card:hover{border-color:rgba(255,255,255,.1)}
.wp-card.dev{border-color:rgba(167,139,250,.18)}
.wp-card.bot{border-color:rgba(255,95,95,.22)}
.wp-card.coord{border-color:rgba(245,208,0,.18)}
.wp-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;opacity:.6}
.wp-card.dev::before{background:linear-gradient(90deg,transparent,var(--purple),transparent)}
.wp-card.bot::before{background:linear-gradient(90deg,transparent,var(--orange),transparent)}
.wp-card.coord::before{background:linear-gradient(90deg,transparent,var(--yellow),transparent)}
.wp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.wp-tag{font-size:8px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:3px 8px;border:1px solid currentColor;border-radius:2px}
.wp-card.dev .wp-tag{color:var(--purple)}
.wp-card.bot .wp-tag{color:var(--orange)}
.wp-card.coord .wp-tag{color:var(--yellow)}
.wp-pct{font:400 22px/1 'Bebas Neue',sans-serif;letter-spacing:.02em}
.wp-card.dev .wp-pct{color:#c4b5fd}
.wp-card.bot .wp-pct{color:#e07070}
.wp-card.coord .wp-pct{color:#d4b040}
.wp-addr{font:600 11px 'IBM Plex Mono',monospace;color:#bbb;margin-bottom:8px}
.wp-rep{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.wp-rep-lbl{font-size:8px;color:#555;letter-spacing:.16em;text-transform:uppercase}
.wp-rep-bar{height:4px;background:#181820;border-radius:2px;overflow:hidden;position:relative}
.wp-rep-fill{height:100%;background:linear-gradient(90deg,var(--risk-fill),var(--risk));box-shadow:0 0 6px var(--risk-glow)}
.wp-rep-fill.warn{background:linear-gradient(90deg,rgba(245,208,0,.4),var(--yellow));box-shadow:0 0 6px rgba(245,208,0,.4)}
.wp-desc{font-size:10.5px;color:#666;line-height:1.5;font-style:italic}
.wp-desc b{color:#bbb;font-style:normal;font-weight:600}
.whales-preview.collapsed{max-height:0;opacity:0;overflow:hidden;transition:max-height .35s ease,opacity .2s}

/* === TAB legacy: Timeline classes (no longer rendered — kept until safe to delete) === */
.tl-list{position:relative}
.tl-list::before{content:'';position:absolute;left:13px;top:14px;bottom:14px;width:1px;background:linear-gradient(180deg,var(--risk) 0%,var(--yellow) 50%,#444 100%);opacity:.3}
.tl-row{display:grid;grid-template-columns:28px 80px 130px 80px 1fr;align-items:center;gap:14px;padding:10px 0;position:relative;z-index:1}
.tl-dot{width:14px;height:14px;border-radius:50%;justify-self:center;border:2px solid var(--bg);box-shadow:0 0 0 1px currentColor}
.tl-dot.now{animation:tl-pulse 2s ease-in-out infinite}
@keyframes tl-pulse{0%,100%{box-shadow:0 0 0 1px currentColor,0 0 0 4px transparent}50%{box-shadow:0 0 0 1px currentColor,0 0 0 6px var(--risk-soft)}}
/* Verdict colour palette — must align with the engine's risk ladder:
     SAFE    → green (--c)
     CAUTION → yellow (--yellow)
     DANGER  → orange (--orange)
     RUG     → red (--red)
   Previous CSS had no explicit `.safe` rule, so the SAFE row inherited
   the parent's text colour and rendered the same yellow as CAUTION —
   broke the at-a-glance read of the timeline. RUG and DANGER were
   both `var(--orange)` (one with opacity), now properly distinct. */
.tl-dot.safe{background:var(--c);color:var(--c)}
.tl-dot.caution{background:var(--yellow);color:var(--yellow)}
.tl-dot.danger{background:var(--orange);color:var(--orange)}
.tl-dot.rug{background:var(--red);color:var(--red)}
.tl-dot.empty{background:transparent;color:#444}
.tl-time{font-size:11px;color:#666;letter-spacing:.06em}
.tl-time.now{color:var(--risk);font-weight:700;letter-spacing:.1em}
.tl-verdict{font:400 18px/1 'Bebas Neue',sans-serif;letter-spacing:.06em}
.tl-verdict.safe{color:var(--c)}
.tl-verdict.caution{color:var(--yellow)}
.tl-verdict.danger{color:var(--orange)}
.tl-verdict.rug{color:var(--red)}
.tl-score{font:600 13px 'IBM Plex Mono',monospace;color:#888}
.tl-score b{color:#ddd}
.tl-event{font-size:11px;color:#777;font-style:italic;line-height:1.5}
.tl-event b{color:#bbb;font-style:normal;font-weight:600}
@media(max-width:700px){.tl-row{grid-template-columns:24px 60px 1fr;gap:10px}.tl-row .tl-score,.tl-row .tl-event{display:none}}

/* === TAB legacy: Holder Activity (.whale-* classes — replaced by Insider Watch heatmap, kept until safe to delete) === */
.whale-list{display:flex;flex-direction:column;gap:1px;background:var(--border)}

.whale-avatar{font:700 10px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:7px 6px;border:1px solid currentColor;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.whale.dev .whale-avatar{color:var(--purple);background:rgba(167,139,250,.05)}

.whale.real .whale-pct{color:#559970}
.whale.whale-big .whale-pct{color:var(--cyan)}
.whale.dev .whale-pct{color:#c4b5fd}
.whale-tag{font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:4px 6px;border-radius:2px;text-align:center;border:1px solid currentColor;white-space:nowrap}
.whale.bot .whale-tag{color:var(--orange);background:rgba(255,95,95,.08)}
.whale.coord .whale-tag{color:var(--yellow);background:rgba(245,208,0,.06)}
.whale.real .whale-tag{color:var(--c);background:rgba(0,229,176,.06)}

.whale-info{min-width:0}

.whale-desc{font-size:10.5px;color:#666;line-height:1.5;font-style:italic}
.whale-desc b{color:#999;font-style:normal;font-weight:600}
@media(max-width:700px){.whale{grid-template-columns:80px 1fr}.whale .whale-pct,.whale .whale-tag{display:none}}

/* === TAB legacy: Outcome Histogram (.sim-* classes — replaced by Wash Volume donut, kept until safe to delete) === */
.sim-hist{margin-bottom:20px}
.sim-hist-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px}
.sim-hist-title{font-size:9px;color:#444;letter-spacing:.22em;text-transform:uppercase}
.sim-hist-detail{font-size:10px;color:#666;font-style:italic}
.sim-hist-bars{display:flex;align-items:flex-end;gap:2px;height:80px;padding:0;border-bottom:1px solid var(--border);position:relative}
.sim-hist-bar{flex:1;background:linear-gradient(180deg,var(--risk) 0%,rgba(255,34,68,.3) 100%);border-radius:1px 1px 0 0;min-height:4px;position:relative;transition:.2s}
.sim-hist-bar.warn{background:linear-gradient(180deg,var(--yellow) 0%,rgba(245,208,0,.3) 100%)}
.sim-hist-bar.ok{background:linear-gradient(180deg,var(--c) 0%,rgba(0,229,176,.3) 100%)}
.sim-hist-bar.you{background:linear-gradient(180deg,#fff 0%,var(--risk-fill) 100%);box-shadow:0 0 12px rgba(255,255,255,.4)}
.sim-hist-axis{display:flex;justify-content:space-between;margin-top:8px;font-size:9px;color:#444;letter-spacing:.1em;text-transform:uppercase}
.sim-hist-marker{position:absolute;bottom:0;width:1px;height:100%;background:#fff;opacity:.6}
.sim-hist-marker::after{content:'YOU';position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:8px;color:#fff;letter-spacing:.18em;font-weight:700;background:#0a0a0c;border:1px solid #fff;padding:2px 5px}
.sim-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--border);margin-bottom:18px}
.sim-stat{background:var(--card);padding:14px 16px;text-align:center;position:relative}
.sim-stat::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;opacity:.5}
.sim-stat.rug::before{background:linear-gradient(90deg,transparent,var(--orange),transparent)}
.sim-stat.slow::before{background:linear-gradient(90deg,transparent,var(--yellow),transparent)}
.sim-stat.alive::before{background:linear-gradient(90deg,transparent,var(--c),transparent)}
.sim-stat-pct{font:400 32px/1 'Bebas Neue',sans-serif;margin-bottom:4px}
.sim-stat.rug .sim-stat-pct{color:var(--orange)}
.sim-stat.slow .sim-stat-pct{color:var(--yellow)}
.sim-stat.alive .sim-stat-pct{color:var(--c)}
.sim-stat-label{font-size:9px;color:#888;letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px}
.sim-stat-detail{font-size:9px;color:#555;font-style:italic}
.sim-token{display:grid;grid-template-columns:24px 1fr 100px 80px;align-items:center;gap:12px;padding:8px 0;border-top:1px dashed #16161a}
.sim-token-icon{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;background:rgba(255,95,95,.12);color:var(--orange)}
.sim-token-name{font:600 12px 'IBM Plex Mono',monospace;color:#aaa}
.sim-token-time{font-size:10px;color:#666;text-align:right}
.sim-token-loss{font:600 13px 'IBM Plex Mono',monospace;color:var(--orange);text-align:right}

/* === TAB legacy: Score Breakdown (.bd-* + .radar — replaced by Sniper Map retention bar, kept until safe to delete) === */
.bd-wrap{display:grid;grid-template-columns:280px 1fr;gap:32px;align-items:center}
@media(max-width:780px){.bd-wrap{grid-template-columns:1fr}}
.radar{position:relative;width:100%;max-width:280px;aspect-ratio:1}
.radar svg{width:100%;height:100%}
.radar .grid{stroke:#1e1e22;fill:none;stroke-width:1}
.radar .axis{stroke:#1a1a1e;stroke-width:1}
.radar .data-fill{fill:var(--risk-soft);stroke:var(--risk);stroke-width:1.5;filter:drop-shadow(0 0 6px var(--risk-glow))}
.radar .data-pt{fill:var(--risk);stroke:#0a0a0c;stroke-width:1.5}
.radar .axis-lbl{font:700 9px 'IBM Plex Mono',monospace;fill:#666;letter-spacing:.14em;text-transform:uppercase}
.radar .axis-val{font:700 11px 'IBM Plex Mono',monospace;fill:var(--risk)}
.bd-bars{display:flex;flex-direction:column;gap:0}
.bd-row{display:grid;grid-template-columns:140px 1fr 50px;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid #16161a}
.bd-row:last-of-type{border:none}
.bd-name{font-size:12px;font-weight:600;color:#bbb}
.bd-bar-wrap{height:5px;background:#181820;border-radius:3px;overflow:hidden}
.bd-bar{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--risk-fill),var(--risk));box-shadow:0 0 6px var(--risk-glow);width:0;transition:width 1.2s cubic-bezier(.22,1,.36,1)}
.bd-score{font:600 15px 'IBM Plex Mono',monospace;text-align:right;color:var(--risk)}

.bd-total{display:flex;justify-content:space-between;align-items:center;padding-top:14px;margin-top:8px;border-top:1px solid var(--risk-border);grid-column:1/-1}
.bd-total-label{font-size:9px;color:#444;letter-spacing:.18em;text-transform:uppercase}
.bd-total-value{font:400 26px/1 'Bebas Neue',sans-serif;color:var(--risk);text-shadow:0 0 16px var(--risk-glow)}
.bd-total-value .max{font-size:11px;color:#444;margin-left:4px}

.exit-row{display:grid;grid-template-columns:90px 90px 1fr 80px;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid #16161a;font-size:12px}

/* ╔═══════════════════════════════════════════════════════════════════════╗
   ║  INSIDER WATCH (Heatmap Tiles) — replaces Timeline                    ║
   ╚═══════════════════════════════════════════════════════════════════════╝ */
.iw-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
@media(max-width:780px){.iw-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:480px){.iw-grid{grid-template-columns:repeat(3,1fr)}}
.iw-tile{
  aspect-ratio:1;border-radius:3px;padding:8px 10px;
  display:flex;flex-direction:column;justify-content:space-between;
  border:1px solid;font-family:'IBM Plex Mono',monospace;
  transition:transform .2s ease,border-color .2s ease;
  position:relative;
}
.iw-tile:hover{transform:translateY(-2px)}
.iw-tile.good{background:rgba(0,229,176,.08);border-color:rgba(0,229,176,.4);color:var(--c)}
.iw-tile.warn{background:rgba(245,208,0,.07);border-color:rgba(245,208,0,.4);color:var(--yellow)}
.iw-tile.bad {background:rgba(255,95,95,.07);border-color:rgba(255,95,95,.4);color:var(--orange)}
.iw-tile.mid {background:rgba(255,255,255,.02);border-color:#222226;color:#888}
.iw-tile.dev{box-shadow:inset 0 0 0 1px var(--purple)}
.iw-tile.dev::after{
  content:'DEV';position:absolute;top:5px;right:6px;
  font-size:7px;font-weight:700;letter-spacing:.12em;color:var(--purple);
}
.iw-name{font-size:9.5px;font-weight:700;letter-spacing:.06em}
.iw-delta{font:400 22px/1 'Bebas Neue',sans-serif;letter-spacing:.02em}
.iw-action{font-size:7.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;opacity:.85}

/* ╔═══════════════════════════════════════════════════════════════════════╗
   ║  INSIDER WATCH v2 — Top 10 live activity feed (replaces heatmap)     ║
   ║  ────────────────────────────────────────────────────────────────    ║
   ║  Replaces the old "STATIC ±0%" tile grid that was useless on most    ║
   ║  tokens. Renders an actionable feed of recent on-chain transactions  ║
   ║  from the top 10 holders, plus a window net-flow footer.             ║
   ╚═══════════════════════════════════════════════════════════════════════╝ */
.iw-feed-wrap{display:flex;flex-direction:column;gap:8px}
.iw-feed-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:0 2px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
}
.iw-feed-title{color:#888;font-weight:700}
.iw-feed-meta{color:#555;font-size:9px;letter-spacing:.1em}
.iw-feed{
  display:flex;flex-direction:column;
  background:#0a0a0c;border:1px solid var(--border);border-radius:3px;
  overflow:hidden;
}
.iw-row{
  display:grid;
  /* Rank pill (#N) added as the first column at 36px so users can
     instantly see WHICH of the top 10 holders is buying/selling
     without having to memorise the truncated address. */
  grid-template-columns: 36px 1fr 90px 1fr 1fr 60px;
  align-items:center;
  gap:8px;
  padding:10px 14px;border-top:1px solid #15151a;
  font-family:'IBM Plex Mono',monospace;font-size:11px;
  text-decoration:none;color:#bbb;
  transition:background .15s ease;
}
.iw-row:first-child{border-top:none}
.iw-row:hover{background:rgba(255,255,255,.03)}
.iw-row-rank{
  font-size:10px;font-weight:700;letter-spacing:.04em;
  color:#5a5a5a;
  background:#15151a;border:1px solid #1f1f24;border-radius:3px;
  padding:3px 6px;text-align:center;
  font-variant-numeric:tabular-nums;
}
.iw-row.buy .iw-row-rank{color:var(--c);border-color:rgba(0,229,176,.25);background:rgba(0,229,176,.04)}
.iw-row.sell .iw-row-rank{color:var(--orange);border-color:rgba(255,95,95,.25);background:rgba(255,95,95,.04)}
.iw-row-wallet{
  color:#888;font-size:10.5px;letter-spacing:.04em;cursor:pointer;
  border-bottom:1px dashed transparent;
}
.iw-row-wallet:hover{color:#ddd;border-bottom-color:#444}
.iw-row-action{
  font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#666;
}
.iw-row.buy .iw-row-action{color:var(--c)}
.iw-row.sell .iw-row-action{color:var(--orange)}
.iw-row-amount{color:#aaa;text-align:right;padding-right:14px;font-variant-numeric:tabular-nums}
.iw-row-usd{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;padding-right:14px;color:#888}
.iw-row.buy .iw-row-usd{color:var(--c)}
.iw-row.sell .iw-row-usd{color:var(--orange)}
.iw-row-age{color:#555;font-size:10px;text-align:right;letter-spacing:.04em}

@media(max-width:640px){
  .iw-row{grid-template-columns:32px 1fr 70px 1fr 50px;font-size:10px;gap:6px}
  .iw-row-usd{display:none}
}

.iw-feed-loading{padding:8px 0}
.iw-skel-row{
  height:38px;margin:0 14px;border-bottom:1px solid #15151a;
  background:linear-gradient(90deg,#0c0c10 0%,#15151a 50%,#0c0c10 100%);
  background-size:200% 100%;animation:iw-skel 1.4s ease-in-out infinite;
}
@keyframes iw-skel{
  0%,100%{background-position:0% 0}
  50%{background-position:-200% 0}
}

.iw-feed-empty{
  padding:36px 20px;text-align:center;color:#555;font-size:11px;
  letter-spacing:.04em;line-height:1.7;
}
.iw-feed-empty.warn{color:var(--yellow)}

/* Fallback holder list — shown when no recent activity is found.
   Keeps the panel feeling "alive" by displaying who holds the supply
   even if nobody traded in the last 6h (treasury / long-term holds). */
.iw-fallback-note{
  padding:12px 14px;color:#888;font-size:10px;letter-spacing:.06em;
  line-height:1.6;border-bottom:1px solid #14141a;background:#0a0a0c;
}
.iw-holder-list{display:flex;flex-direction:column}
.iw-holder-row{
  display:grid;
  grid-template-columns:34px 1fr 64px 1fr 60px;
  align-items:center;gap:10px;
  padding:10px 14px;border-bottom:1px solid #13131a;
  text-decoration:none;color:#bbb;
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  transition:background .12s ease;
}
.iw-holder-row:hover{background:rgba(255,255,255,.025)}
.iw-holder-row:last-child{border-bottom:none}
.iw-holder-rank{
  color:#555;font-weight:700;font-size:9.5px;letter-spacing:.06em;
}
.iw-holder-wallet{
  color:#ddd;font-weight:600;letter-spacing:.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.iw-holder-pct{
  color:#f5d000;font-weight:700;font-variant-numeric:tabular-nums;
  text-align:right;
}
.iw-holder-amount{
  color:#777;font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  text-align:right;
}
.iw-holder-state{
  font-size:9px;letter-spacing:.18em;font-weight:700;
  text-align:right;color:#555;
}
.iw-holder-row.active .iw-holder-state{color:var(--c)}
.iw-holder-row.idle   .iw-holder-state{color:#444}
@media (max-width:580px){
  .iw-holder-row{grid-template-columns:28px 1fr 56px 56px;}
  .iw-holder-amount{display:none}
}

.iw-feed-foot{display:flex}
.iw-flow{
  display:flex;justify-content:space-between;align-items:center;flex:1;
  padding:10px 14px;border:1px solid var(--border);border-radius:3px;
  background:rgba(255,255,255,.02);
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;
}
.iw-flow-label{color:#666;font-size:9px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
.iw-flow-val{font-variant-numeric:tabular-nums;font-weight:700;color:#aaa}
.iw-flow-state{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#666;font-weight:700}
.iw-flow.buy .iw-flow-val,.iw-flow.buy .iw-flow-state{color:var(--c)}
.iw-flow.sell .iw-flow-val,.iw-flow.sell .iw-flow-state{color:var(--orange)}

/* ╔═══════════════════════════════════════════════════════════════════════╗
   ║  BUY/SELL FLOW (Pressure Gauge Hero) — replaces Holder Activity      ║
   ╚═══════════════════════════════════════════════════════════════════════╝ */
.bsf-hero{
  background:#0a0a0c;border:1px solid var(--border);border-radius:3px;
  padding:24px 28px;margin-bottom:14px;text-align:center;
}
.bsf-status{font:400 36px/1 'Bebas Neue',sans-serif;letter-spacing:.04em;margin-bottom:6px}
.bsf-status.good{color:var(--c);text-shadow:0 0 32px rgba(0,229,176,.25)}
.bsf-status.bad {color:var(--orange);text-shadow:0 0 32px rgba(255,95,95,.25)}
.bsf-status.warn{color:var(--yellow);text-shadow:0 0 32px rgba(245,208,0,.2)}
.bsf-net{font-size:11px;color:#888;letter-spacing:.06em;margin-bottom:18px}
.bsf-net b{color:#ddd;font-weight:700}
.bsf-net b.good{color:var(--c)}
.bsf-net b.bad {color:var(--orange)}
.bsf-gauge{
  position:relative;height:8px;background:#13131a;border-radius:1px;
  max-width:480px;margin:0 auto;overflow:hidden;
}
.bsf-gauge::before{
  content:'';position:absolute;left:50%;top:-3px;bottom:-3px;
  width:1px;background:#444;
}
.bsf-gauge-fill{position:absolute;top:0;bottom:0;transition:left .6s,right .6s,background .25s}
.bsf-gauge-fill.good{background:linear-gradient(90deg,rgba(0,229,176,.2),var(--c))}
.bsf-gauge-fill.bad {background:linear-gradient(90deg,var(--orange),rgba(255,95,95,.2))}
.bsf-gauge-fill.warn{background:rgba(255,255,255,.18)}
.bsf-gauge-axis{
  display:flex;justify-content:space-between;margin:8px auto 0;max-width:480px;
  font-size:8px;color:#555;letter-spacing:.2em;text-transform:uppercase;font-weight:700;
}
.bsf-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.bsf-mini-card{
  background:#0a0a0c;border:1px solid var(--border);
  padding:12px 14px;border-radius:3px;text-align:center;
}
.bsf-mini-w{font-size:8.5px;color:#666;letter-spacing:.2em;text-transform:uppercase;font-weight:700;margin-bottom:4px}
.bsf-mini-net{font:400 20px/1 'Bebas Neue',sans-serif;letter-spacing:.02em}
.bsf-mini-net.good{color:var(--c)}
.bsf-mini-net.bad {color:var(--orange)}
.bsf-mini-net.warn{color:var(--yellow)}
.bsf-mini-net.mid {color:#aaa}
.bsf-mini-net.dim {color:#444}
.bsf-mini-sub{font-size:9px;color:#666;margin-top:4px;letter-spacing:.04em}

/* ╔═══════════════════════════════════════════════════════════════════════╗
   ║  WASH VOLUME (Circular Donut) — replaces Outcome Histogram           ║
   ╚═══════════════════════════════════════════════════════════════════════╝ */
.wv-wrap{
  display:grid;grid-template-columns:200px 1fr;gap:32px;align-items:center;
  background:#0a0a0c;border:1px solid var(--border);padding:24px;border-radius:3px;
}
@media(max-width:600px){.wv-wrap{grid-template-columns:1fr;justify-items:center}}
.wv-donut{position:relative;width:200px;height:200px}
.wv-donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.wv-donut .wv-track{fill:none;stroke:#13131a;stroke-width:14}
.wv-donut .wv-fill{fill:none;stroke-width:14;stroke-linecap:round;transition:stroke-dasharray 1s ease}
.wv-donut-center{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
}
.wv-donut-num{font:400 56px/1 'Bebas Neue',sans-serif;letter-spacing:.02em;color:#eaeaea}
.wv-donut-num.good{color:var(--c);text-shadow:0 0 24px rgba(0,229,176,.3)}
.wv-donut-num.warn{color:var(--yellow);text-shadow:0 0 24px rgba(245,208,0,.25)}
.wv-donut-num.bad {color:var(--orange);text-shadow:0 0 24px rgba(255,95,95,.3)}
.wv-donut-lbl{font-size:9px;color:#666;letter-spacing:.22em;text-transform:uppercase;font-weight:700;margin-top:6px}
.wv-info{display:flex;flex-direction:column;gap:14px;width:100%}
.wv-info-row{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:10px 0;border-bottom:1px solid #16161a;
}
.wv-info-row:last-child{border-bottom:none}
.wv-info-l{font-size:10px;color:#666;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.wv-info-r{font-family:'IBM Plex Mono',monospace;font-size:13px;color:#ddd;font-weight:600}
.wv-info-r.good{color:var(--c)}
.wv-info-r.warn{color:var(--yellow)}
.wv-info-r.bad {color:var(--orange)}

/* ╔═══════════════════════════════════════════════════════════════════════╗
   ║  SNIPER MAP (Retention Bar) — replaces Score Breakdown               ║
   ╚═══════════════════════════════════════════════════════════════════════╝ */
.sm-bar-wrap{
  background:#0a0a0c;border:1px solid var(--border);border-radius:3px;
  padding:22px 24px;
}
.sm-title{font:400 14px/1 'Bebas Neue',sans-serif;letter-spacing:.04em;color:#eaeaea;margin-bottom:14px}
.sm-bar{
  display:flex;height:44px;border-radius:2px;overflow:hidden;
  border:1px solid #16161a;
}
.sm-seg{
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;
  flex-direction:column;gap:2px;
  transition:flex .6s cubic-bezier(.22,1,.36,1);
  min-width:0;
}
.sm-seg .pct{font:400 18px/1 'Bebas Neue',sans-serif}
.sm-seg.holding{background:rgba(0,229,176,.65);color:#08161a}
.sm-seg.partial{background:rgba(245,208,0,.55);color:#1a1a08}
.sm-seg.exited {background:rgba(255,95,95,.6);color:#1a0808}
.sm-seg.pending{background:rgba(255,255,255,.05);color:#888}
.sm-axis{
  display:flex;justify-content:space-between;margin-top:10px;
  font-size:8.5px;color:#666;letter-spacing:.18em;text-transform:uppercase;font-weight:700;
}

/* ╔═══════════════════════════════════════════════════════════════════════╗
   ║  Shared tab-alert verdict line (used by all 4 new tabs)              ║
   ╚═══════════════════════════════════════════════════════════════════════╝ */
.tab-alert{
  margin-top:14px;padding:11px 14px 11px 36px;
  font-size:11px;letter-spacing:.04em;line-height:1.55;
  border-radius:3px;border:1px solid;position:relative;
}
.tab-alert::before{
  content:'';position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:tab-alert-pulse 2.4s ease-in-out infinite;
}
@keyframes tab-alert-pulse{0%,100%{opacity:.7}50%{opacity:1}}
.tab-alert.good{color:#5fe5b8;border-color:rgba(0,229,176,.3);background:rgba(0,229,176,.05)}
.tab-alert.warn{color:#f5d05a;border-color:rgba(245,208,0,.3);background:rgba(245,208,0,.05)}
.tab-alert.bad {color:#ff7777;border-color:rgba(255,95,95,.3);background:rgba(255,95,95,.05)}
.tab-alert.mid {color:#999;border-color:rgba(255,255,255,.1);background:rgba(255,255,255,.02)}

/* ── HOLDERS concentration card (kept inside tabs or its own section) ── */
.holders-card{background:var(--card);border:1px solid var(--border);padding:18px 20px}
.holders-card .lbl{font-size:9px;color:#444;letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px}
.hbar{display:flex;height:16px;border-radius:3px;overflow:hidden;background:#0a0a0c;margin-bottom:12px}
.hbar .seg{display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:rgba(0,0,0,.85);transition:width 1.4s cubic-bezier(.22,1,.36,1);min-width:0;white-space:nowrap;overflow:hidden}
.hbar .seg.top1{background:var(--risk)}
.hbar .seg.top10{background:color-mix(in srgb,var(--risk) 75%,#000)}
.hbar .seg.top50{background:color-mix(in srgb,var(--risk) 45%,#000);color:#ddd}
.hbar .seg.rest{background:#2a2a30;color:#888}
.hbar-legend{display:flex;flex-wrap:wrap;gap:18px;font-size:10px;color:#666}
.hbar-legend span{display:flex;align-items:center;gap:6px}
.hbar-legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.hbar-legend .dot.top1{background:var(--risk)}
.hbar-legend .dot.top10{background:color-mix(in srgb,var(--risk) 75%,#000)}
.hbar-legend .dot.top50{background:color-mix(in srgb,var(--risk) 45%,#000)}
.hbar-legend .dot.rest{background:#2a2a30}

/* ── MARKET grid (kept for now, sits inside its own foldable section) ── */
.mkt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--border);border:1px solid var(--border)}
.mkt-cell{background:var(--card);padding:18px 16px}
.mkt-cell .lbl{font-size:8px;color:#444;letter-spacing:.18em;text-transform:uppercase;margin-bottom:6px}
.mkt-cell .val{font:600 18px 'IBM Plex Mono',monospace;color:#ddd;word-break:break-all}
.mkt-cell .delta{font-size:10px;margin-top:3px;font-weight:600;letter-spacing:.04em}
.mkt-cell .delta.up{color:var(--c)}.mkt-cell .delta.dn{color:var(--orange)}.mkt-cell .delta.neu{color:#555}

/* ── ON-CHAIN grid ── */
.oc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--border);border:1px solid var(--border)}
.oc-cell{background:var(--card);padding:14px 16px}
.oc-cell .lbl{font-size:8px;color:#444;letter-spacing:.18em;text-transform:uppercase;margin-bottom:4px}
.oc-cell .val{font:600 14px 'IBM Plex Mono',monospace;color:#ccc;word-break:break-all}
.oc-cell a{color:#ccc;text-decoration:none;display:flex;align-items:center;gap:6px;transition:color .2s}
.oc-cell a:hover{color:var(--c)}
.oc-cell a .ext{font-size:9px;color:#444}

/* ── SOURCE BREAKDOWN — 1 row par source, simple ── */
.src-list{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border)}
.src-row{display:grid;grid-template-columns:130px 100px 1fr;align-items:center;gap:16px;padding:12px 16px;background:var(--card)}
.src-name{font:600 12px 'IBM Plex Mono',monospace;color:#ccc}
.src-verdict{font:700 10px 'IBM Plex Mono',monospace;letter-spacing:.18em;text-transform:uppercase}
.src-row.bad .src-verdict{color:var(--orange)}
.src-row.warn .src-verdict{color:var(--yellow)}
.src-row.ok .src-verdict{color:var(--c)}
.src-row.na .src-verdict{color:#555}
.src-note{font-size:11px;color:#777;line-height:1.5}
.src-row.na .src-note{color:#444}
@media(max-width:600px){.src-row{grid-template-columns:1fr}.src-name{margin-bottom:4px}.src-verdict{margin-bottom:4px}}

/* ── Reveal on scroll ── */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1)}
.reveal.visible{opacity:1;transform:translateY(0)}

/* ── Sources marquee ── */
.marquee-wrap{overflow:hidden;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:14px 0;margin-top:24px}
.marquee-inner{display:flex;animation:scroll 32s linear infinite;white-space:nowrap}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.mi{font:400 16px/1 'Bebas Neue',sans-serif;color:#252528;letter-spacing:.14em;padding:0 28px;display:inline-flex;align-items:center;gap:10px}
.mi .ok{color:var(--c);font-size:10px}

footer{text-align:center;padding:32px 0 20px;color:#2a2a2f;font-size:10px;letter-spacing:.15em;text-transform:uppercase;margin-top:40px;border-top:1px solid var(--border)}
footer span{color:var(--c)}

/* ── Ask Antares FAB + contextual pills (bottom-right) ── */
.ask-fab-wrap{position:fixed;bottom:24px;right:24px;z-index:200}
.ask-fab{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--cyan));border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;box-shadow:0 8px 32px rgba(167,139,250,.4),0 0 0 1px rgba(255,255,255,.1) inset;transition:transform .25s;animation:fab-glow 3s ease-in-out infinite}
@keyframes fab-glow{0%,100%{box-shadow:0 8px 32px rgba(167,139,250,.4),0 0 0 1px rgba(255,255,255,.1) inset}50%{box-shadow:0 8px 48px rgba(167,139,250,.6),0 0 0 1px rgba(255,255,255,.15) inset,0 0 60px rgba(34,211,238,.2)}}
.ask-fab:hover{transform:scale(1.1)}
.fab-pills{position:absolute;bottom:64px;right:0;display:flex;flex-direction:column;gap:8px;align-items:flex-end;opacity:0;pointer-events:none;transform:translateY(8px);transition:.3s}
.ask-fab-wrap:hover .fab-pills,.ask-fab-wrap.open .fab-pills{opacity:1;pointer-events:auto;transform:translateY(0)}
.fab-pill{display:inline-flex;align-items:center;gap:6px;background:#1a1a1e;color:#ccc;padding:8px 14px;border-radius:20px;font-size:11px;letter-spacing:.04em;border:1px solid #2a2a30;cursor:pointer;transition:.2s;white-space:nowrap;font-family:'IBM Plex Mono',monospace}
.fab-pill:hover{border-color:var(--purple);color:var(--purple);transform:translateX(-2px)}
.fab-pill .ico{font-size:11px;color:var(--purple)}
</style>
</head>
<body>
<div class="stripe" aria-hidden="true"></div>
<div class="cursor-glow" id="cursor-glow" aria-hidden="true"></div>
<canvas id="bg" aria-hidden="true"></canvas>

<div class="shell">

<nav id="nav" aria-label="Token analysis navigation">
  <a class="brand" href="https://antares-website.vercel.app/" aria-label="Antares home"><img src="/favicon.png" alt="">ANTARES</a>
  <div class="nav-mid">
    <span class="nav-ticker" id="nav-ticker">—</span>
    <span class="nav-verdict" id="nav-verdict">—</span>
    <span class="nav-score" id="nav-score">—</span>
  </div>
  <div class="actions" id="nav-actions">
    <span class="ca-pill" id="ca-disp">—</span>
  </div>
</nav>

<div id="loading">
  <div class="spin"></div>
  LOADING ANALYSIS
  <span id="loading-status"></span>
</div>

<div id="err">
  <div id="err-msg">Analysis failed. Please try again.</div>
  <button id="err-retry">↺ Retry</button>
</div>

<main id="content"></main>

<footer>Antares <span>·</span> v1.2.0 <span>·</span> Solana Token Scanner</footer>

</div>

  <div class="fab-pills">
    <button class="fab-pill" data-q="why"><span class="ico">▸</span> Why this verdict?</button>
    <button class="fab-pill" data-q="sell"><span class="ico">▸</span> Should I sell now or wait?</button>

  </div>
  <button class="ask-fab" aria-label="Ask Antares AI">✦</button>
</div>
