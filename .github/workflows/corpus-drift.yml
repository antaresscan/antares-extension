# Weekly corpus drift detection
#
# Re-scans a rotating sample of the captured fixtures against the live
# /api/scan engine and reports verdict changes / score drift. Without this
# the corpus ages silently: a SAFE memecoin can rug overnight and the
# fixture still says SAFE forever, making the accuracy report mislead.
#
# Why weekly, on a sample: every scan is a fresh, full pipeline run on
# production (Helius RPC, RugCheck, GoPlus, Solscan, the AI summary). Doing
# the whole corpus every night meant ~500 of them a day and ~100 minutes of
# runner time, 82 near-identical issues, for a signal that does not move daily.
#
# Behaviour:
#   - Runs every Monday at 03:00 UTC on 100 entries. The window rotates with
#     the ISO week, so the whole corpus is covered in about five runs.
#   - Uses scripts/corpus-drift-check.ts which spaces requests by 2.5s
#     to respect the /api/scan rate limit (30 req/min).
#   - Hits the deployed production endpoint; doesn't write fixtures
#     (read-only check, never mutates the repo).
#   - Exit code 1 (drift > 5% of the compared entries): opens ONE tracking
#     issue, or refreshes it if it is still open.
#   - Any other non-zero exit code means the check itself is broken
#     (production down, too many failed captures, crash). The job then FAILS,
#     so it is visible, instead of passing green having measured nothing.
#   - Manually triggerable via workflow_dispatch, with an optional sample
#     size (0 = the whole corpus, about two hours).
name: Corpus drift check
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays, 03:00 UTC
  workflow_dispatch: # manual trigger from Actions UI
    inputs:
      sample:
        description: "Entries to re-scan (0 = the whole corpus)"
        required: false
        default: "100"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
concurrency:
  group: corpus-drift
  cancel-in-progress: false
jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      issues: write # needed to open the drift issue
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run drift check (threshold 5%)
        id: drift
        env:
          SAMPLE: ${{ github.event.inputs.sample || '100' }}
        run: |
          case "$SAMPLE" in
            ''|*[!0-9]*) echo "::error::sample must be a whole number, got '$SAMPLE'"; exit 1 ;;
          esac
          # Keep the exit code instead of failing the step: the report is
          # uploaded either way, and the steps below decide what it means
          # (1 = drift to triage, anything else = the check is broken).
          set +e
          npx tsx scripts/corpus-drift-check.ts --threshold=0.05 --sample="$SAMPLE" \
            > drift-report.txt 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Always show the report in the action log.
          cat drift-report.txt

      - name: Upload drift report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: drift-report.txt
          retention-days: 30

      - name: Open or refresh the drift issue
        if: steps.drift.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const report = fs.readFileSync('drift-report.txt', 'utf8');
            const today = new Date().toISOString().slice(0, 10);
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const title = 'Corpus drift above threshold';
            const body = [
              '> Kept up to date by `.github/workflows/corpus-drift.yml`.',
              '> One issue, refreshed by each run that finds drift.',
              '',
              `Last run: ${today} ([run](${run}))`,
              '',
              'More than 5% of the re-scanned fixtures have either changed',
              'verdict or moved > 150 score points against the live engine.',
              '',
              '## Drift report',
              '',
              '```',
              report.slice(-12_000), // tail in case it's huge
              '```',
              '',
              '## Recommended actions',
              '',
              '- For each verdict change: decide whether to recapture',
              '  the fixture (`npm run corpus:capture <SYMBOL> --refresh`)',
              '  or update the label in `__tests__/backtest/corpus.ts`.',
              '- For score drifts within the same verdict: usually safe',
              '  to recapture if the new score still falls in the band.',
              '- Verify with `npm run test:corpus` after.',
            ].join('\n');

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'drift', per_page: 100,
            });
            const existing = open.find((i) => !i.pull_request && i.title === title);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Still above the threshold on ${today} ([run](${run})). The description holds the latest report.`,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body, labels: ['drift', 'corpus', 'automated'],
              });
            }

      - name: Fail when the check itself could not run
        if: steps.drift.outputs.exit_code != '0' && steps.drift.outputs.exit_code != '1'
        run: |
          echo "::error::The drift check produced no result (exit code ${{ steps.drift.outputs.exit_code }}). See the drift-report artifact."
          exit 1
