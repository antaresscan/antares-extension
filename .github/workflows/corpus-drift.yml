# Nightly corpus drift detection
#
# Re-scans every captured fixture against the live /api/scan engine
# and reports verdict changes / score drift. Without this the corpus
# ages silently — a SAFE memecoin can rug overnight and the fixture
# still says SAFE forever, making the accuracy report mislead.
#
# Behaviour:
#   - Runs daily at 03:00 UTC (low traffic, after data refresh).
#   - Uses scripts/corpus-drift-check.ts which spaces requests by 2.5s
#     to respect the /api/scan rate limit (30 req/min).
#   - Hits the deployed production endpoint; doesn't write fixtures
#     (read-only check, never mutates the repo).
#   - On drift > 5%, opens (or updates) a tracking issue so a human
#     can recapture / update labels.
#   - Manually triggerable via workflow_dispatch.
name: Corpus drift check
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: # manual trigger from Actions UI
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # needed to open the drift issue
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run drift check (threshold 5%)
        id: drift
        run: |
          # Capture exit code without failing the step — we want the
          # report rendered + issue opened even when drift exceeds.
          set +e
          npx tsx scripts/corpus-drift-check.ts --threshold=0.05 \
            > drift-report.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          # Always show the report in the action log.
          cat drift-report.txt

      - name: Upload drift report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: drift-report.txt
          retention-days: 30

      - name: Open issue when drift exceeds threshold
        if: steps.drift.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('drift-report.txt', 'utf8');
            const today = new Date().toISOString().slice(0, 10);
            const title = `Corpus drift detected — ${today}`;
            const body = [
              '> Auto-opened by `.github/workflows/corpus-drift.yml`.',
              '',
              'The nightly drift check found that more than 5% of the',
              'captured fixtures have either changed verdict or moved',
              '> 150 score points against the live engine.',
              '',
              '## Drift report',
              '',
              '```',
              report.slice(-12_000), // tail in case it's huge
              '```',
              '',
              '## Recommended actions',
              '',
              '- For each verdict change: decide whether to recapture',
              '  the fixture (`npm run corpus:capture <SYMBOL> --refresh`)',
              '  or update the label in `__tests__/backtest/corpus.ts`.',
              '- For score drifts within the same verdict: usually safe',
              '  to recapture if the new score still falls in the band.',
              '- Verify with `npm run test:corpus` after.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['drift', 'corpus', 'automated'],
            });
