name: "Submit to Web Store"
on:
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    # The Web Store is reached with SUBMIT_KEYS, not with the GitHub token: the token only needs to read the code. Without the
    # block it got the repository's default token, which can be read-write, in a job that runs `npm ci`.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Build the extension
        run: npx plasmo build

      # Evaluate the packaged content script and Options page before they
      # go to the Web Store: a bundle that crashes on load must never ship.
      - name: Smoke-test the packaged bundles
        run: npm run smoke

      - name: Package the extension into a zip artifact
        run: npx plasmo package

      - name: Browser Platform Publish
        uses: PlasmoHQ/bpp@c15984c0a74f452851c605cab46f34d9fd6cb158 # v3
        with:
          keys: ${{ secrets.SUBMIT_KEYS }}
          artifact: build/chrome-mv3-prod.zip
