name: "Submit to Web Store"
on:
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Build the extension
        run: npx plasmo build

      # Evaluate the packaged content script and Options page before they
      # go to the Web Store: a bundle that crashes on load must never ship.
      - name: Smoke-test the packaged bundles
        run: npm run smoke

      - name: Package the extension into a zip artifact
        run: npx plasmo package

      - name: Browser Platform Publish
        uses: PlasmoHQ/bpp@v3
        with:
          keys: ${{ secrets.SUBMIT_KEYS }}
          artifact: build/chrome-mv3-prod.zip
