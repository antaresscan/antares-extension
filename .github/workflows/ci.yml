name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3.9.1
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Lint
        run: npx eslint . --ext .ts,.tsx

      - name: Build extension
        run: npx plasmo build

      - name: Coverage
        run: npx vitest run --coverage --reporter=json --outputFile=coverage/coverage.json
