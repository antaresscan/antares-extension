# CI workflow
name: CI
on:
  push:
    branches: [master, "fix/**", "feat/**"]
  pull_request:
    branches: [master]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Cache the npm registry by package-lock.json hash. Skips the
          # network round-trip for unchanged dependency trees and removes
          # the ECONNRESET failure mode that flaked CI #1751.
          cache: "npm"

      - name: Install dependencies
        # `npm install` rather than `npm ci` because the current
        # lockfile has a pre-existing drift (Plasmo peer-deps resolve
        # differently between npm 10 and npm 11) that the strict
        # `npm ci` refuses to install. Wrapped in a retry loop because
        # GitHub-hosted runners occasionally ECONNRESET against the npm
        # registry on first connect — three attempts with linear
        # backoff covers the transient case without papering over a
        # real outage.
        # TODO: switch back to `npm ci` once the lockfile is regenerated
        # under the same npm version that runs in CI.
        run: |
          for i in 1 2 3; do
            if npm install --no-audit --no-fund; then exit 0; fi
            echo "npm install failed (attempt $i) — backing off ${i}0s"
            sleep $((i * 10))
          done
          exit 1

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test with coverage
        run: npx vitest run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Lint
        run: npx eslint .

      - name: Build extension
        run: npx plasmo build

      # Smoke-load the packaged content-script bundle in happy-dom to
      # catch the class of crash that broke the overlay during the
      # 2026-05-19 → 2026-05-20 incident: the Zod schema import at
      # module top level threw on the user's Chrome, the content
      # script never reached its init block, the overlay never
      # mounted, and CI was green because no existing job evaluated
      # the actual packaged bundle. This smoke does exactly that:
      # eval the bundle in a Node + happy-dom + chrome.* shim
      # environment and assert the GUARD attribute gets set. If the
      # bundle throws on boot for ANY reason (Sentry init, schema
      # import, missing global, etc.) this step fails and the build
      # never publishes a broken artifact.
      - name: Smoke-test packaged content-script bundle
        run: npm run smoke

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: antares-extension-build
          path: build/chrome-mv3-prod/
          retention-days: 30

  e2e:
    runs-on: ubuntu-latest
    needs: build
    # Waiting for Vercel to finish building this commit can take a few minutes.
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      # The e2e only tells us something when the run changes what is deployed or
      # the e2e itself. A bump of typescript-eslint, a change to the extension or
      # to the docs cannot alter an HTTP response, so it is skipped there. The
      # rules live in .github/scripts/e2e-needed.mjs; when in doubt it runs.
      # The job always ends green on a skip, with the reason in the run summary.
      - name: Does this run need the e2e?
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .github/scripts/e2e-needed.mjs

      # The e2e used to test production (https://antares-extension.vercel.app)
      # on EVERY run, so its result described production at that moment instead
      # of the commit under test: a PR was judged on the old code, the run a merge
      # triggers started before the deploy finished, and live market data could
      # turn any PR red. It now tests the Vercel deployment built from THIS commit
      # (Preview for a branch / PR, Production for master) — see the script.
      - name: Wait for the deployment of this commit
        if: steps.decide.outputs.needed == 'true'
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WANT_ENV: ${{ github.ref == 'refs/heads/master' && 'Production' || 'Preview' }}
          FALLBACK_URL: https://antares-extension.vercel.app
        run: |
          url=$(bash .github/scripts/resolve-deployment.sh)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "E2E target: $url"

      - uses: actions/setup-node@v4
        if: steps.decide.outputs.needed == 'true'
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: steps.decide.outputs.needed == 'true'
        # See build job above for npm install vs npm ci rationale.
        run: |
          for i in 1 2 3; do
            if npm install --no-audit --no-fund; then exit 0; fi
            echo "npm install failed (attempt $i) — backing off ${i}0s"
            sleep $((i * 10))
          done
          exit 1

      - name: Install Playwright browsers
        if: steps.decide.outputs.needed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (API + integration)
        if: steps.decide.outputs.needed == 'true'
        run: npx playwright test --project=api --project=integration
        env:
          CI: true
          E2E_BASE_URL: ${{ steps.target.outputs.url }}
          # The Origin the tests present is a fixed, allowed one: it must not
          # follow the deployment URL (a preview host is not an allowed origin).
          E2E_ORIGIN: https://antares-extension.vercel.app

      - name: Upload E2E report
        if: always() && steps.decide.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
