name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Build extension
        run: npx plasmo build

      # Same smoke as ci.yml / submit.yml: don't attach a zip whose content
      # script or Options page crashes on load.
      - name: Smoke-test the packaged bundles
        run: npm run smoke

      - name: Package extension
        run: |
          cd build/chrome-mv3-prod
          zip -r ../../antares-extension-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: antares-extension-${{ github.ref_name }}.zip
          generate_release_notes: true
