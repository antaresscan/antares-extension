name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # `npm install` (not `npm ci`) to match ci.yml. The Plasmo 0.90.5
      # transitive peer-dep tree confuses npm 10's strict ci mode against
      # an npm 11-generated lockfile (it asks for react@18.3.1 even though
      # the package is on react@19). `npm install` resolves the peers
      # leniently and produces an identical install. Switch back to
      # `npm ci` once Plasmo is bumped to a React-19-aware release.
      - run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Build extension
        run: npx plasmo build

      - name: Package extension
        run: |
          cd build/chrome-mv3-prod
          zip -r ../../antares-extension-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: antares-extension-${{ github.ref_name }}.zip
          generate_release_notes: true
