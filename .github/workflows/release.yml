name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Build extension
        run: npx plasmo build

      # Same smoke as ci.yml / submit.yml: don't attach a zip whose content
      # script or Options page crashes on load.
      - name: Smoke-test the packaged bundles
        run: npm run smoke

      - name: Package extension
        run: |
          cd build/chrome-mv3-prod
          zip -r ../../antares-extension-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: antares-extension-${{ github.ref_name }}.zip
          generate_release_notes: true
